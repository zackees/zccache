[package]
name = "zccache-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Internal IPC transport and daemon connection helpers for zccache"
publish = false

[dependencies]
kernal-api = { workspace = true, features = ["ipc", "ipc-async", "daemon-registration", "daemon-identity", "daemon-frame-v1", "broker-client"] }
zccache-core = { workspace = true }
zccache-protocol = { workspace = true }

bytes = { workspace = true }
dashmap = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["tracing"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
zccache-depgraph = { workspace = true }

[lints]
workspace = true
