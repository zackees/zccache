[package]
name = "zccache-watcher-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "PyO3 extension module (zccache.watcher._native) for zccache-watcher"
publish = false

# cdylib ONLY. Keeping this crate-type off `zccache-watcher` is the whole point
# of this crate: see README.md and zccache#1497.
[lib]
name = "zccache_watcher"
crate-type = ["cdylib"]

[dependencies]
zccache-watcher = { workspace = true }
pyo3 = { version = "0.23", features = [
    "extension-module",
    "generate-import-lib",
    "abi3-py310",
] }

[build-dependencies]
pyo3-build-config = "0.23"
