[package]
name = "zccache-fingerprint-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "PyO3 extension module (zccache.fingerprint._native) for zccache-fingerprint"
publish = false

# cdylib ONLY -- see README.md and zccache#1497.
[lib]
name = "zccache_fingerprint"
crate-type = ["cdylib"]
# The `name` override keeps the output filename stable for packaging, which
# collides with the parent crate's docs. The Rust API is the parent's; this
# crate is the Python extension surface.
doc = false

[dependencies]
zccache-fingerprint = { workspace = true }
zccache-hash = { workspace = true }
pyo3 = { version = "0.23", features = [
    "extension-module",
    "generate-import-lib",
    "abi3-py310",
] }

[build-dependencies]
pyo3-build-config = "0.23"
