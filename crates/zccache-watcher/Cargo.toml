[package]
name = "zccache-watcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Cross-platform file watcher engine for zccache"
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []

[dependencies]
kernal-api = { workspace = true, features = ["fs", "fs-watch"] }
zccache-core = { workspace = true }
zccache-fscache = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Production code reaches the runtime through `kernal_api::async_engine`
# (kernal-api#69). tokio stays here only for `#[tokio::test]` and the
# `tokio::spawn` / `tokio::time` calls inside those tests.
tokio = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
