# ci-attestations (zackees/ci.yml#198, GATE-010).
#
# Each gate is one thing CI would otherwise verify remotely, named by the
# platform schema path <ecosystem>/<platform>/<check>. `lane` is the
# local-gate.toml lane whose pass proves it: `ci-lint local-gate run` writes
# one compact-JSON `Ci-Attestation:` trailer per gate of each passed lane
# into the commit message (never into the tree). A gate with no trailer was
# not run locally, so CI runs it.
#
# `jobs` maps each remote job to the gates it runs. On a PR, the `ci-mode`
# job skips a job only when every one of its gates is attested and
# stamp-valid AND the head passes [gate.trust] (local-gate.toml). This file
# is read from the PR's base and is itself a trust surface. Pushes to main
# always run every job, and a release always ignores attestations.
version: 1
gates:
  rust/all/fmt: {lane: lint}               # rustfmt --check
  python/all/static: {lane: lint}          # pyright, benchmark contract tests, CI guards
  python/all/test: {lane: py-tests}        # ci/tests (no skipped job; python-tests.yml still runs it)
  rust/x86_64-unknown-linux-gnu/check: {lane: check}   # cargo check on the pinned (= MSRV) toolchain
  rust/x86_64-unknown-linux-gnu/doc: {lane: docs}      # rustdoc -D warnings
  rust/x86_64-unknown-linux-gnu/test: {lane: tests}    # Integration (Linux) test commands, in bosn
jobs:
  ci.yml:fmt: [rust/all/fmt, python/all/static]
  ci.yml:docs: [rust/x86_64-unknown-linux-gnu/doc]
  ci.yml:msrv: [rust/x86_64-unknown-linux-gnu/check, rust/x86_64-unknown-linux-gnu/test]
  integration.yml:integration: [rust/x86_64-unknown-linux-gnu/test]
