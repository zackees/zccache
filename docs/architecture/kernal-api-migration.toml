# Machine-checked inventory for zccache#1519.
[inventory]
issue = "zccache#1519"
consumer_umbrella = "zccache#1518"
kernel_implementation = "zackees/kernal-api#5"
kernel_packaging = "zackees/kernal-api#3"

[[platform_group]]
source = "crates/zccache-platform/src/platform/executable.rs"
items = ["native_name", "native_library_name", "find_in_paths", "find_on_path", "current_image", "images_equal", "stem_matches", "unlock_for_replacement"]
disposition = "extend"
kernel_capability = "executable identity, discovery, naming, and safe replacement"
[[platform_group]]
source = "crates/zccache-platform/src/platform/executable.rs"
items = ["clang_library_candidates"]
disposition = "retain"
owner = "zccache-cli-core"
reason = "Compiler-specific candidate ordering is product policy, not host discovery."
[[platform_group]]
source = "crates/zccache-platform/src/platform/host.rs"
items = ["os", "arch", "is_windows", "is_macos", "is_linux", "home_dir", "runtime_dir", "current_user", "cpu_identity_material", "available_parallelism", "is_elevated"]
disposition = "extend"
kernel_capability = "host facts, user/runtime directories, and privilege facts"
[[platform_group]]
source = "crates/zccache-platform/src/platform/host.rs"
items = ["DefenderError", "defender_supported", "defender_exclusions", "add_defender_exclusion", "remove_defender_exclusion"]
disposition = "retain"
owner = "zccache-core and zccache-cli-core"
reason = "Defender exclusion UX and policy are zccache-specific."

[[platform_group]]
source = "crates/zccache-platform/src/platform/fs/identity.rs"
