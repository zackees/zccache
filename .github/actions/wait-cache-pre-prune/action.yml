name: Wait for exact-SHA cache pre-prune
description: Block main push cache writers until current-lock pruning succeeds.

runs:
  using: composite
  steps:
    - name: Wait for the exact-SHA cache pre-prune run
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.token }}
        script: |
          const expectedSha = context.sha;
          if (!expectedSha) throw new Error("missing pushed SHA; refusing cache writes");

          const branchHead = async () => (await github.rest.repos.getBranch({
            ...context.repo,
            branch: "main",
          })).data.commit.sha;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          // The pre-prune job allows 320 minutes for its producer barrier,
          // then up to 20 minutes for inventory convergence. Keep this waiter
          // bounded to 355 minutes, below the caller's 360-minute ceiling.
          const maxAttempts = 1420;

          for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
            const currentHead = await branchHead();
            if (currentHead !== expectedSha) {
              throw new Error(
                `main advanced to ${currentHead}; ${expectedSha} must not write caches`,
              );
            }

            const response = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: "cache-pre-prune.yml",
              branch: "main",
              head_sha: expectedSha,
              per_page: 100,
            });
            const candidates = response.data.workflow_runs
              .filter((run) => run.event === "push" && run.head_branch === "main")
              .sort((a, b) =>
                (b.run_attempt || 1) - (a.run_attempt || 1) ||
                Date.parse(b.created_at) - Date.parse(a.created_at),
              );
            const prePrune = candidates[0];

            if (prePrune?.status === "completed") {
              if (prePrune.conclusion !== "success") {
                throw new Error(
                  `cache pre-prune for ${expectedSha} concluded ${prePrune.conclusion}; refusing cache writes`,
                );
              }
              if (await branchHead() !== expectedSha) {
                throw new Error(`main advanced while waiting for pre-prune ${expectedSha}`);
              }
              core.info(`Cache pre-prune succeeded for current main SHA ${expectedSha}.`);
              return;
            }

            if (attempt + 1 < maxAttempts) await sleep(15_000);
          }
          throw new Error(
            `no successful cache pre-prune for ${expectedSha} after ${maxAttempts} checks; refusing cache writes`,
          );
    - name: Normalize Cargo.lock to the Windows cache identity
      if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        git config --local core.autocrlf true
        git checkout-index --force -- Cargo.lock
        if ($LASTEXITCODE -ne 0) {
          throw "could not normalize Cargo.lock to the Windows cache identity"
        }
        $lock = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes("Cargo.lock"))
        if ($lock -notmatch "`r`n" -or $lock -match "(?<!`r)`n") {
          throw "Cargo.lock did not normalize to the required CRLF cache identity"
        }
        git diff --exit-code -- Cargo.lock
        if ($LASTEXITCODE -ne 0) {
          throw "Cargo.lock normalization changed its tracked contents"
        }
