name: Build target artifacts
description: Build zccache binaries for a single target and stage release artifacts.

inputs:
  target:
    description: Rust target triple to build.
    required: true
  binary_ext:
    description: Executable suffix for the target, for example .exe.
    required: false
    default: ""
  cache_key:
    description: Cache key suffix passed to setup-soldr.
    required: true
  use_soldr:
    description: Use setup-soldr for setup and caching.
    required: false
    default: "true"
  cross_compile:
    description: Build from a Linux x86 host with a soldr-managed cross driver.
    required: false
    default: "false"
  prebuild_deps:
    description: setup-soldr prebuild dependency mode.
    required: false
    default: soldr-cook
  clear_target_after_setup:
    description: Clear restored target artifacts after setup-soldr; use for cross-target builds.
    required: false
    default: "false"
  require_debug_sidecars:
    description: Fail when per-binary debug sidecars are missing.
    required: false
    default: "true"
  include_python:
    description: Build and stage Python extension artifacts.
    required: false
    default: "false"
  python_version:
    description: Python version to install for packaging and optional Python extension builds.
    required: false
    default: "3.13"
  linker:
    description: Optional linker executable for cross-compilation.
    required: false
    default: ""
  strip:
    description: Optional strip executable for the target.
    required: false
    default: ""
  version:
    description: Optional version string for standalone archive naming.
    required: false
    default: ""

outputs:
  staging_dir:
    description: Directory containing staged binaries and optional Python artifacts.
    value: ${{ steps.paths.outputs.staging_dir }}
  standalone_dir:
    description: Directory containing packaged standalone archives.
    value: ${{ steps.paths.outputs.standalone_dir }}

runs:
  using: composite
  steps:
    - name: Set output paths
      id: paths
      shell: bash
      run: |
        echo "staging_dir=${{ github.workspace }}/staging" >> "$GITHUB_OUTPUT"
        echo "standalone_dir=${{ github.workspace }}/standalone" >> "$GITHUB_OUTPUT"

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Select Rust toolchain
      shell: bash
      run: |
        echo "RELEASE_RUST_TOOLCHAIN=${{ inputs.cross_compile == 'true' && '1.95.0' || (contains(inputs.target, 'pc-windows-msvc') && '1.95.0-x86_64-pc-windows-msvc' || '1.95.0') }}" >> "$GITHUB_ENV"

    - name: Install musl tools
      if: inputs.cross_compile != 'true' && inputs.target == 'x86_64-unknown-linux-musl'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools

    - name: Install musl cross-compilation tools
      if: inputs.cross_compile != 'true' && inputs.target == 'aarch64-unknown-linux-musl'
      shell: bash
      run: |
        curl -fsSL -o aarch64-unknown-linux-musl.tar.xz \
          https://github.com/cross-tools/musl-cross/releases/download/20250929/aarch64-unknown-linux-musl.tar.xz
        tar xJf aarch64-unknown-linux-musl.tar.xz
        echo "$PWD/aarch64-unknown-linux-musl/bin" >> "$GITHUB_PATH"

    - name: Install GNU cross-compilation tools
      if: inputs.cross_compile != 'true' && inputs.target == 'aarch64-unknown-linux-gnu'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Configure cross-compilation linker
      if: inputs.cross_compile != 'true' && inputs.linker != ''
      shell: bash
      run: |
        TARGET_UPPER=$(echo "${{ inputs.target }}" | tr '[:lower:]-' '[:upper:]_')
        TARGET_CC=$(echo "${{ inputs.target }}" | tr '-' '_')
        echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${{ inputs.linker }}" >> "$GITHUB_ENV"
        echo "CC_${TARGET_CC}=${{ inputs.linker }}" >> "$GITHUB_ENV"

    - name: Configure cross C compatibility
      if: inputs.cross_compile == 'true'
      shell: bash
      run: |
        # Zig cross targets promote __DATE__/__TIME__ to an error, and soldr
        # still materializes zig for the Linux/Darwin cross lanes. The
        # mimalloc-pprof amalgamation reports its build timestamp, so retain
        # the diagnostic without making that vendored C source unbuildable.
        #
        # Unlike the C++ language-mode override removed in #1439, this is a warning
        # flag: it is safe to apply graph-wide because it does not change how
        # any source is interpreted.
        printf 'CFLAGS=%s\n' "${CFLAGS:+$CFLAGS }-Wno-error=date-time" >> "$GITHUB_ENV"
        printf 'CXXFLAGS=%s\n' "${CXXFLAGS:+$CXXFLAGS }-Wno-error=date-time" >> "$GITHUB_ENV"

    - name: Install LLVM dSYM tools
      if: contains(inputs.target, 'apple-darwin')
      shell: bash
      run: |
        set -euo pipefail
        if command -v dsymutil >/dev/null 2>&1; then
          dsymutil --version
          exit 0
        fi
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y llvm
        if command -v dsymutil >/dev/null 2>&1; then
          dsymutil --version
          exit 0
        fi
        llvm_dsymutil="$(command -v llvm-dsymutil || true)"
        if [ -z "$llvm_dsymutil" ]; then
          llvm_dsymutil="$(find -L /usr/bin -maxdepth 1 -type f -executable -name 'llvm-dsymutil*' -print | sort -V | tail -n 1)"
        fi
        test -n "$llvm_dsymutil" && test -x "$llvm_dsymutil"
        sudo ln -s "$llvm_dsymutil" /usr/local/bin/dsymutil
        test -x /usr/local/bin/dsymutil
        dsymutil --version


    - name: Setup soldr build cache
      if: inputs.use_soldr == 'true'
      uses: zackees/setup-soldr@e138f3c43682cb3f6afa0eb5a1e808b24a0224bb
      with:
        toolchain: 1.95.0
        cross-targets: ${{ inputs.cross_compile == 'true' && inputs.target || '' }}
        cache: true
        cache-key-suffix: build-${{ inputs.cache_key }}
        linker: ${{ inputs.cross_compile == 'true' && 'platform-default' || 'fast' }}
        prebuild-deps: ${{ inputs.prebuild_deps }}
        prebuild-deps-flags: "--release --target ${{ inputs.target }}"
        compile-cache-stats: detailed
        verify-compile-cache: ${{ inputs.cross_compile == 'true' && 'error' || 'off' }}

    - name: Verify Rust host toolchain
      shell: bash
      run: |
        info="$(rustup run "$RELEASE_RUST_TOOLCHAIN" rustc -vV)"
        printf '%s\n' "$info"
        host="$(printf '%s\n' "$info" | awk '/^host: / { print $2 }')"
        if [ "${{ inputs.cross_compile }}" = "true" ] && [ "$host" != "x86_64-unknown-linux-gnu" ]; then
          echo "::error::Cross release builds require the Linux x86 host toolchain, got: ${host:-<missing>}" >&2
          exit 1
        fi
        if [ "${{ inputs.cross_compile }}" != "true" ] && [[ "${{ inputs.target }}" == *pc-windows-msvc ]] && [ "$host" != "x86_64-pc-windows-msvc" ]; then
          echo "::error::Windows release builds must use the MSVC host toolchain, got: ${host:-<missing>}" >&2
          exit 1
        fi

    - name: Verify bootstrap zccache selection
      if: inputs.cross_compile == 'true'
      shell: bash
      run: |
        set -euo pipefail
        test -n "${SOLDR_RUSTC_WRAPPER:-}"
        test -x "$SOLDR_RUSTC_WRAPPER"
        resolved="$(command -v zccache)"
        if [ "$resolved" != "$SOLDR_RUSTC_WRAPPER" ]; then
          echo "::error::Bootstrap zccache is not first on PATH: $resolved" >&2
          exit 1
        fi
        "$SOLDR_RUSTC_WRAPPER" --version

    - name: Clear restored target artifacts
      if: inputs.clear_target_after_setup == 'true'
      shell: bash
      run: |
        TARGET_DIR="target/${{ inputs.target }}"
        if [ -e "$TARGET_DIR" ] || [ -L "$TARGET_DIR" ]; then
          echo "Removing restored target artifacts from $TARGET_DIR"
          rm -rf "$TARGET_DIR"
        fi

    - name: Remove stale release binaries
      shell: bash
      run: |
        TARGET_DIR="target/${{ inputs.target }}/release"
        rm -f \
          "$TARGET_DIR/zccache${{ inputs.binary_ext }}" \
          "$TARGET_DIR/zccache-fp${{ inputs.binary_ext }}"

    # Static-link the MSVC C runtime (vcruntime + UCRT) for Windows release
    # binaries. Without `+crt-static` the published `zccache.exe` declares
    # imports against `VCRUNTIME140.dll` and the `api-ms-win-crt-*` UCRT
    # API-set forwarders, and then fails to start wherever those are not
    # resolvable.
    #
    # The load-bearing case is the PyPI install path. CPython on Windows
    # ships `vcruntime140.dll` *app-locally*, next to `python.exe` -- see
    # cpython's `PC/layout/support/python.props`. A wheel-installed
    # `zccache.exe` lands in `<env>/Scripts/`, and the loader searches the
    # directory of the *executable*, so it never sees Python's copy. It then
    # depends on a system-wide VC++ redist that may simply not be there.
    # This is astral-sh/ruff#11503 exactly; their fix was +crt-static too.
    # The raw-binary paths (this action's curl install, install.ps1) have no
    # Python process involved at all.
    #
    # NB: zccache#269 attributed this to `STATUS_DLL_INIT_FAILED`
    # (`0xC0000142`). That code means the DLL was found and its DllMain
    # returned FALSE; a *missing* DLL is `STATUS_DLL_NOT_FOUND`
    # (`0xC0000135`). The hosted runner images do ship the VC++ redist, so
    # whatever produced 0xC0000142 there is still unexplained -- the flag is
    # kept for the `Scripts/` argument above, which is independently sound.
    #
    # Self-contained CRT linkage is the norm for distributable Rust binaries
    # on Windows: ripgrep, fd, bat, uv, ruff, and rustup all set this, and
    # rustc/cargo hard-code it in bootstrap (`crt_static()`).
    #
    # We DO NOT apply +crt-static to the Python extension (.pyd) builds
    # below — those load into the host Python process and must share its
    # below — those load into the host Python process and must share its
    # C runtime. Static CRT linkage is appended to RUSTFLAGS only for the
    # standalone binary build step.
    - name: Build release binaries
      shell: bash
      env:
        PYO3_PYTHON: python
      run: |
        # Native distribution builds keep the historical no-cache path. Linux
        # cross lanes deliberately use the current-worktree bootstrap zccache;
        # setup-soldr's post gate rejects a silently bypassed compiler cache.
        # Zig cross builds are especially memory-heavy on the two-core hosted
        # Linux runners. Keep one rustc child alive at a time; exit 255 means a
        # signaled compiler child and persisted with two concurrent children.
        # The Windows MSVC lanes showed the same signaled rustc-child exit (255) once
        # the Zig lanes were serialized. Keep every hosted cross lane to one
        # rustc child at a time.
        if [ "${{ inputs.cross_compile }}" = "true" ]; then
          cargo_build=(soldr build --jobs 1 -j 1)
        elif [ "${{ inputs.use_soldr }}" = "true" ]; then
          cargo_build=(soldr --no-cache cargo build)
        else
          cargo_build=(rustup run "$RELEASE_RUST_TOOLCHAIN" cargo build)
        fi
        if [[ "${{ inputs.target }}" == *pc-windows-msvc ]]; then
          # soldr >= 0.9.4 reads +crt-static from CARGO_ENCODED_RUSTFLAGS,
          # CARGO_TARGET_<TRIPLE>_RUSTFLAGS and RUSTFLAGS, and emits the
          # matching CRT halves itself (zackees/soldr#2794 -> #2798). The
          # counter-flags this block used to carry are gone with it; the
          # CRT-linkage gate below is what proves the replacement.
          export RUSTFLAGS="${RUSTFLAGS:-} -C target-feature=+crt-static"
        fi
        # #1017 Lever 1: build all three shipped binaries in ONE cargo
        # invocation with unified features. Building them separately (one
        # invocation per feature set) re-resolved features and recompiled the
        # whole `zccache` lib THREE times per platform. One invocation compiles
        # the lib once and links the three bins — matching perf-rust-cluster.yml.
        # zccache-fp is a bin shipped *inside* the umbrella `zccache` crate (the
        # sibling `zccache-fingerprint` crate is a pyo3 cdylib and produces no
        # native executable); the staging step below `cp`s `target/.../zccache-fp`
        # into `staging/`.
        "${cargo_build[@]}" --release --target ${{ inputs.target }} -p zccache \
          --features zccache-bin,fingerprint-bin \
          --bin zccache --bin zccache-fp

    # Windows DLL load smoke gate (see zccache#269). If the just-built
    # `zccache.exe` cannot complete loader init on this host, `--version`
    # exits non-zero before any Rust code runs and the release stops here
    # rather than shipping a binary that will fail in CI consumers. Other
    # platforms run the same check for symmetry but the Windows leg is
    # the one that actually catches the regression. ARM64 Windows builds
    # are cross-compiled on x64 runners and so cannot exec the binary on
    # this leg — skip the smoke for that target only.
    - name: Assert Windows binaries link the CRT statically
      if: contains(inputs.target, 'pc-windows-msvc')
      shell: bash
      run: |
        set -euo pipefail
        # zccache#269 regression gate. The shipped .exe must not import the
        # dynamic CRT: a wheel-installed zccache.exe lives in <env>/Scripts/,
        # while CPython keeps its own vcruntime140.dll app-local next to
        # python.exe, so the loader does not find it from Scripts/. Same story
        # for the raw-binary install paths (action.yml curl, install.ps1),
        # which involve no Python process at all. See astral-sh/ruff#11503.
        #
        # This runs on the cross host and needs no execution, which is the
        # point: "Smoke test built binary" skips every cross target, so
        # nothing verified CRT linkage. The soldr migration (#1497) silently
        # produced a dynamic-CRT aarch64 binary that a green matrix would
        # have shipped -- x64 only failed loudly because lld-link hit a
        # duplicate symbol first.
        #
        # .pyd extensions are deliberately excluded: a PyO3 module MUST share
        # the host interpreter's dynamic CRT.
        fail=0
        for bin in zccache zccache-fp; do
          path="target/${{ inputs.target }}/release/${bin}${{ inputs.binary_ext }}"
          [ -e "$path" ] || { echo "::error::$path was not built"; fail=1; continue; }
          found="$(strings -a "$path" \
            | grep -iE '^(vcruntime[0-9]*\.dll|ucrtbase\.dll|api-ms-win-crt-[a-z]+-l[0-9]-[0-9]-[0-9]\.dll)$' \
            | sort -u || true)"
          if [ -n "$found" ]; then
            echo "::error::$path imports the dynamic CRT; +crt-static did not take effect (zccache#269)"
            printf '  %s\n' $found
            fail=1
          else
            echo "OK: $path links the CRT statically"
          fi
        done
        exit "$fail"

    - name: Smoke test built binary
      shell: bash
      run: |
        case "${{ inputs.target }}" in
          *apple-darwin|*pc-windows-msvc|aarch64-unknown-linux-musl|aarch64-unknown-linux-gnu)
            # Cross-compiled; skip exec on host. TODO: when matrix gains
            # an arm64 runner, gate aarch64-pc-windows-msvc through it.
            echo "Skipping smoke test for cross-compiled target ${{ inputs.target }}"
            exit 0
            ;;
        esac
        BIN="target/${{ inputs.target }}/release/zccache${{ inputs.binary_ext }}"
        echo "Smoke test: $BIN --version"
        version="$("$BIN" --version)"
        printf '%s\n' "$version"
        if ! printf '%s\n' "$version" | grep -Eq '^zccache [0-9]'; then
          echo "::error::Built zccache binary did not report a valid version: ${version:-<empty>}" >&2
          exit 1
        fi

    - name: Build Python extension artifacts
      if: inputs.include_python == 'true'
      shell: bash
      env:
        PYO3_PYTHON: python
      run: |
        HOST_TARGET=$(rustup run "$RELEASE_RUST_TOOLCHAIN" rustc -vV | awk '/^host: / { print $2 }')
        if [ "$HOST_TARGET" != "${{ inputs.target }}" ]; then
          export PYO3_CROSS=1
          export PYO3_CROSS_PYTHON_VERSION="${{ inputs.python_version }}"
          export PYO3_CROSS_PYTHON_IMPLEMENTATION=CPython
        fi

        # The Python extension cdylibs live in their own thin pyo3 crates
        # (zccache-cli / zccache-watcher / zccache-fingerprint) per the Wave 7
        # monocrate split. The umbrella `zccache` rlib intentionally does NOT
        # carry the `python` feature, so `-p zccache --features python` is a
        # workflow-only build-target bug that latently broke the release path.
        # Surfaced when 1.9.1 became the first version bump after that split.
        if [ "${{ inputs.cross_compile }}" = "true" ]; then
          cargo_build=(soldr build --jobs 1 -j 1)
        elif [ "${{ inputs.use_soldr }}" = "true" ]; then
          cargo_build=(soldr --no-cache cargo build)
        else
          cargo_build=(rustup run "$RELEASE_RUST_TOOLCHAIN" cargo build)
        fi
        "${cargo_build[@]}" --release --target ${{ inputs.target }} -p zccache-cli --features python --lib
        "${cargo_build[@]}" --release --target ${{ inputs.target }} -p zccache-watcher-py --lib
        "${cargo_build[@]}" --release --target ${{ inputs.target }} -p zccache-fingerprint-py --lib

    - name: Repair missing Linux debug sidecars
      if: inputs.cross_compile == 'true' && contains(inputs.target, 'unknown-linux')
      shell: bash
      env:
        PYO3_PYTHON: python
      run: |
        set -euo pipefail
        TARGET="${{ inputs.target }}"
        TARGET_DIR="target/$TARGET/release"
        if [ -e "$TARGET_DIR/zccache.dwp" ] && [ -e "$TARGET_DIR/zccache-fp.dwp" ]; then
          echo "Linux debug sidecars were produced by the cache-first build"
          exit 0
        fi

        # A cached rustc link can restore the executable without the packed
        # split-debuginfo sidecar. Preserve the normal cache-first build and
        # its warm dependencies, then rebuild only the shipped umbrella
        # package without the wrapper so rustc emits both .dwp files locally.
        echo "Packed Linux debug sidecars are missing; rebuilding zccache locally"
        soldr cargo clean -p zccache --release --target "$TARGET"
        soldr --no-cache build --jobs 1 -j 1 \
          --release --target "$TARGET" -p zccache \
          --features zccache-bin,fingerprint-bin \
          --bin zccache --bin zccache-fp
        test -e "$TARGET_DIR/zccache.dwp"
        test -e "$TARGET_DIR/zccache-fp.dwp"

    - name: Stage artifacts
      shell: bash
      run: |
        rm -rf staging standalone
        mkdir -p staging
        cp target/${{ inputs.target }}/release/zccache${{ inputs.binary_ext }} staging/
        cp target/${{ inputs.target }}/release/zccache-fp${{ inputs.binary_ext }} staging/

        if [ "${{ inputs.include_python }}" = "true" ]; then
          mkdir -p staging/python/zccache/fingerprint
          mkdir -p staging/python/zccache/watcher
          if [[ "${{ inputs.target }}" == *pc-windows-msvc ]]; then
            cp target/${{ inputs.target }}/release/zccache_cli.dll staging/python/zccache/_native.pyd
            cp target/${{ inputs.target }}/release/zccache_fingerprint.dll staging/python/zccache/fingerprint/_native.pyd
            cp target/${{ inputs.target }}/release/zccache_watcher.dll staging/python/zccache/watcher/_native.pyd
          elif [[ "${{ inputs.target }}" == *apple-darwin ]]; then
            cp target/${{ inputs.target }}/release/libzccache_cli.dylib staging/python/zccache/_native.so
            cp target/${{ inputs.target }}/release/libzccache_fingerprint.dylib staging/python/zccache/fingerprint/_native.so
            cp target/${{ inputs.target }}/release/libzccache_watcher.dylib staging/python/zccache/watcher/_native.so
          else
            cp target/${{ inputs.target }}/release/libzccache_cli.so staging/python/zccache/_native.so
            cp target/${{ inputs.target }}/release/libzccache_fingerprint.so staging/python/zccache/fingerprint/_native.so
            cp target/${{ inputs.target }}/release/libzccache_watcher.so staging/python/zccache/watcher/_native.so
          fi
        fi

        # Use --strip-debug to drop DWARF sections without removing the
        # function-name symbol table that profilers read. With
        # [profile.release] split-debuginfo = "packed" the binary already
        # ships without embedded debug info on Linux/macOS, so this is mostly
        # belt-and-suspenders. Fall back to plain `strip` when the
        # cross-tool doesn't support the flag.
        case "${{ inputs.target }}" in
          *pc-windows-msvc)
            echo "Skipping strip for Windows MSVC artifacts"
            ;;
          *)
            STRIP="${{ inputs.strip }}"
            if [ -z "$STRIP" ]; then
              STRIP="strip"
            fi
            do_strip() {
              if "$STRIP" --strip-debug "$1" 2>/dev/null; then
                return 0
              fi
              "$STRIP" "$1" 2>/dev/null || true
            }
            if command -v "$STRIP" &> /dev/null; then
              do_strip staging/zccache${{ inputs.binary_ext }}
              do_strip staging/zccache-fp${{ inputs.binary_ext }}
              if [ "${{ inputs.include_python }}" = "true" ]; then
                for native in staging/python/zccache/_native.* \
                              staging/python/zccache/fingerprint/_native.* \
                              staging/python/zccache/watcher/_native.*; do
                  [ -e "$native" ] && do_strip "$native"
                done
              fi
            fi
            ;;
        esac

    - name: Stage debug-symbol sidecars
      shell: bash
      run: |
        # Collect per-binary debug files into staging-debug/ for packaging as
        # a separate "-debug" archive in the next step. Files come from the
        # split-debuginfo = "packed" profile setting:
        #   Linux:        <bin>.dwp
        #   macOS:        <bin>.dSYM/   (directory)
        #   Windows MSVC: <bin>.pdb
        #
        # Windows PDB naming: rustc's MSVC linker writes the hyphenated
        # `zccache-fp` target's PDB with an underscored crate name:
        #   zccache-fp.exe      ->  zccache_fp.pdb
        # `zccache.exe` is the exception because its [[bin]] name has no
        # hyphens. Windbg/cdb find a PDB by GUID via the codeview record
        # embedded in the PE, so the underscored filename on disk still
        # resolves for `zccache-fp.exe`. See zccache#276 for the missing-PDB
        # regression that motivated this naming fix.
        rm -rf staging-debug
        mkdir -p staging-debug
        copy_debug() {
          local src="$1"
          if [ -e "$src" ] || [ -L "$src" ]; then
            if [ -d "$src" ]; then
              cp -RL "$src" staging-debug/
            else
              cp -L "$src" staging-debug/
            fi
          fi
        }
        copy_or_create_dsym() {
          local bin="$1"
          local dsym="$2"
          copy_debug "$TARGET_DIR/$dsym"
          if [ ! -e "staging-debug/$dsym" ] && [ ! -L "staging-debug/$dsym" ]; then
            if command -v dsymutil >/dev/null 2>&1 && [ -e "$TARGET_DIR/$bin" ]; then
              dsymutil "$TARGET_DIR/$bin" -o "staging-debug/$dsym"
            elif command -v llvm-dsymutil >/dev/null 2>&1 && [ -e "$TARGET_DIR/$bin" ]; then
              llvm-dsymutil "$TARGET_DIR/$bin" -o "staging-debug/$dsym"
            fi
          fi
        }
        TARGET_DIR="target/${{ inputs.target }}/release"
        TARGET="${{ inputs.target }}"
        case "$TARGET" in
          *pc-windows-msvc)
            copy_debug "$TARGET_DIR/zccache.pdb"
            copy_debug "$TARGET_DIR/zccache_daemon.pdb"
            copy_debug "$TARGET_DIR/zccache_fp.pdb"
            ;;
          *apple-darwin)
            copy_or_create_dsym "zccache" "zccache.dSYM"
            copy_or_create_dsym "zccache-fp" "zccache-fp.dSYM"
            ;;
          *)
            copy_debug "$TARGET_DIR/zccache.dwp"
            copy_debug "$TARGET_DIR/zccache-fp.dwp"
            ;;
        esac
        echo "Staged debug sidecars:"
        ls -la staging-debug || true
        REQUIRE_DEBUG_SIDECARS="${{ inputs.require_debug_sidecars }}"
        # Fail the build if a target's debug sidecars are missing entirely.
        # On Windows in particular, silent misses regressed zccache#276 where
        # only zccache.pdb shipped while the daemon/fp PDBs were skipped.
        if [ -z "$(ls -A staging-debug 2>/dev/null)" ]; then
          if [ "$REQUIRE_DEBUG_SIDECARS" = "true" ]; then
            echo "::error::No debug sidecars staged for target $TARGET" >&2
            exit 1
          fi
          echo "::warning::No debug sidecars staged for target $TARGET" >&2
          exit 0
        fi
        # Per-binary completeness check: each of the three bins must have a
        # matching sidecar present. Failing here surfaces naming drift (e.g.
        # the rustc PDB-name convention change that caused zccache#276)
        # before it ships to a release.
        case "$TARGET" in
          *pc-windows-msvc) require=("zccache.pdb" "zccache_fp.pdb") ;;
          *apple-darwin)    require=("zccache.dSYM" "zccache-fp.dSYM") ;;
          *)                require=("zccache.dwp" "zccache-fp.dwp") ;;
        esac
        missing=()
        for entry in "${require[@]}"; do
          if [ ! -e "staging-debug/$entry" ]; then
            missing+=("$entry")
          fi
        done
        if [ ${#missing[@]} -gt 0 ]; then
          if [ "$REQUIRE_DEBUG_SIDECARS" = "true" ]; then
            echo "::error::Missing debug sidecars for $TARGET: ${missing[*]}" >&2
            exit 1
          fi
          echo "::warning::Missing debug sidecars for $TARGET: ${missing[*]}" >&2
        fi

    - name: Stamp release binaries with release marker
      shell: bash
      run: |
        # We stamp the *target* binaries after stripping (so the stamp
        # isn't clipped) and before archiving (so the archive carries
        # the stamped bytes). Build timestamp captured once for all
        # three binaries so they share the same provenance footer.
        NOW="$(date -u +%s)"
        VERSION="${{ inputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION=$(python -c "import tomllib; from pathlib import Path; print(tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version'])")
        fi
        for bin in zccache zccache-fp; do
          BIN_PATH="staging/${bin}${{ inputs.binary_ext }}"
          if [ ! -e "$BIN_PATH" ]; then
            echo "::error::binary missing for stamping: $BIN_PATH" >&2
            exit 1
          fi
          python ci/stamp_release.py \
            --binary "$BIN_PATH" \
            --sha "$GITHUB_SHA" \
            --version "$VERSION" \
            --triple "${{ inputs.target }}" \
            --timestamp "$NOW"
        done

    - name: Validate staged release binaries
      shell: bash
      run: |
        case "${{ inputs.target }}" in
          *pc-windows-msvc)
            min_size=1048576
            ;;
          *)
            min_size=262144
            ;;
        esac
        for bin in zccache zccache-fp; do
          path="staging/${bin}${{ inputs.binary_ext }}"
          if [ ! -f "$path" ]; then
            echo "::error::Missing staged binary: $path" >&2
            exit 1
          fi
          size=$(wc -c < "$path" | tr -d '[:space:]')
          if [ "$size" -lt "$min_size" ]; then
            echo "::error::Staged binary is suspiciously small for ${{ inputs.target }}: $path ($size bytes, minimum $min_size)" >&2
            exit 1
          fi
        done

        case "${{ inputs.target }}" in
          *apple-darwin|*pc-windows-msvc|aarch64-unknown-linux-musl|aarch64-unknown-linux-gnu)
            echo "Skipping staged binary execution check for cross-compiled target ${{ inputs.target }}"
            exit 0
            ;;
        esac

        for bin in zccache zccache-fp; do
          path="staging/${bin}${{ inputs.binary_ext }}"
          version="$("$path" --version)"
          printf '%s\n' "$version"
          if ! printf '%s\n' "$version" | grep -Eq "^${bin} [0-9]"; then
            echo "::error::Staged binary did not report a valid version: $path" >&2
            exit 1
          fi
        done

        smoke_root="${RUNNER_TEMP:-/tmp}/zccache-release-smoke-${{ inputs.target }}"
        rm -rf "$smoke_root"
        mkdir -p "$smoke_root"
        export ZCCACHE_CACHE_DIR="$smoke_root/cache"
        cleanup() {
          staging/zccache${{ inputs.binary_ext }} stop >/dev/null 2>&1 || true
          rm -rf "$smoke_root"
        }
        trap cleanup EXIT

        rustc_bin="$(rustup which --toolchain "$RELEASE_RUST_TOOLCHAIN" rustc)"
        probe="$(staging/zccache${{ inputs.binary_ext }} "$rustc_bin" -vV)"
        printf '%s\n' "$probe"
        if ! printf '%s\n' "$probe" | grep -q '^host: '; then
          echo "::error::zccache RUSTC_WRAPPER smoke did not print rustc host metadata" >&2
          exit 1
        fi

        staging/zccache${{ inputs.binary_ext }} start
        staging/zccache${{ inputs.binary_ext }} status

    - name: Package standalone archive
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION=$(python -c "import tomllib; from pathlib import Path; print(tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version'])")
        fi
        python ci/package_release.py \
          --version "$VERSION" \
          --target "${{ inputs.target }}" \
          --binary-ext "${{ inputs.binary_ext }}" \
          --input-dir staging \
          --debug-input-dir staging-debug \
          --output-dir standalone
