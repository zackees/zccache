name: Cache Cleanup

# zccache#1677: prune obsolete per-commit generations and exact cache
# families whose producers were disabled after measured low reuse. The
# standalone solo-toolchain archive and the two measured macOS build-cache
# key roots are eligible only on refs/heads/main; PR-ref caches remain untouched.
#
# Runs daily on the default branch and remains manually dispatchable for
# release-and-cascade work. It runs before cache-budget.yml so stale
# per-commit generations are retired before the budget check. It does not run
# from push or pull-request events, where cache saves could race with pruning.
#
# Strategy: keep the newest entry for each distinct reusable cache shape and
# retire older generations. Shapes retain platform, architecture, target and
# feature dimensions; a new generation for one target cannot evict another.
# The retired prefixes above are the only foundation-family exception. The
# hard-cap step may remove additional stale generations, never the newest
# entry for a live shape or any other foundation family.
#
# Manual runs default to a read-only dry run. Inspect the listed cache keys,
# refs and sizes before dispatching with `dry-run: false` to delete them.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List exact cache targets without deleting them"
        type: boolean
        required: true
        default: true

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prune-per-commit-caches:
    name: Prune stale per-commit cache entries
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Gate on cache usage (skip when under 8 GB high-water mark)
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            // Skip the cleanup when cache usage is under the high-water
            // mark. The 10 GB cap is GitHub's soft limit (LRU eviction
            // engages above it). Triggering at 8 GB leaves 2 GB
            // headroom for in-flight workflow saves to complete
            // without forcing eviction of small long-lived caches.
            const HIGH_WATER_GB = 8;
            const usage = await github.rest.actions.getActionsCacheUsage(context.repo);
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { ...context.repo, per_page: 100 }
            );
            const listedBytes = caches.reduce((sum, cache) => sum + cache.size_in_bytes, 0);
            const { effectiveCacheBytes } = require(
              `${process.env.GITHUB_WORKSPACE}/ci/cache_cleanup_plan.js`
            );
            const sizeBytes = effectiveCacheBytes(
              usage.data.active_caches_size_in_bytes,
              listedBytes,
            );
            const sizeGb = sizeBytes / 1000 / 1000 / 1000;
            console.log(
              `Repo cache: ${Math.max(usage.data.active_caches_count, caches.length)} entries, ` +
              `${sizeGb.toFixed(2)} GB (high-water: ${HIGH_WATER_GB} GB)`
            );
            if (sizeGb < HIGH_WATER_GB) {
              console.log("Under high-water mark — skipping cleanup.");
              core.setOutput("needed", "false");
            } else {
              console.log("Over high-water mark — cleanup needed.");
              core.setOutput("needed", "true");
            }

      - name: Prune stale cache generations (keep newest per shape)
        if: steps.gate.outputs.needed == 'true'
        id: count-prune
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs['dry-run'] }}
        with:
          script: |
            // Keep the newest generation of every live restore shape. The
            // planner also retires two exact main-only families whose
            // producers are disabled; it never selects their PR-ref copies.
            const { planCountPrune } = require(
              `${process.env.GITHUB_WORKSPACE}/ci/cache_cleanup_plan.js`
            );
            const repo = context.repo;
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { ...repo, per_page: 100, sort: "created_at", direction: "desc" }
            );

            let totalPruned = 0;
            let totalBytes = 0;
            const prunedIds = [];
            const dryRun = process.env.DRY_RUN === "true";
            const { keep, stale } = planCountPrune(caches);
            console.log(`${keep.length} current shapes; ${stale.length} stale generations.`);
            for (const c of stale) {
                if (dryRun) {
                  prunedIds.push(c.id);
                  totalBytes += c.size_in_bytes;
                  totalPruned += 1;
                  console.log(
                    `  Would delete ${c.key} (id ${c.id}, ` +
                    `${(c.size_in_bytes / 1024 / 1024).toFixed(0)} MB, ` +
                    `${c.ref}, age ${((Date.now() - new Date(c.created_at).getTime()) / 3600000).toFixed(1)}h)`
                  );
                  continue;
                }
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    ...repo,
                    cache_id: c.id,
                  });
                  prunedIds.push(c.id);
                  totalBytes += c.size_in_bytes;
                  totalPruned += 1;
                  console.log(
                    `  Deleted ${c.key} (${(c.size_in_bytes / 1024 / 1024).toFixed(0)} MB, age ` +
                    `${((Date.now() - new Date(c.created_at).getTime()) / 3600000).toFixed(1)}h)`
                  );
                } catch (err) {
                  // Tolerate 404 — another cleanup workflow may have
                  // raced and deleted this entry already. Workflow_run
                  // fires this cleanup from multiple parent workflows
                  // simultaneously, so concurrent deletes on the same
                  // stale entry are expected.
                  if (err.status === 404) {
                    console.log(`  Skipped ${c.key} (already deleted by concurrent cleanup)`);
                  } else {
                    throw err;
                  }
                }
            }
            core.setOutput("pruned-cache-ids", JSON.stringify(prunedIds));
            core.setOutput("pruned-bytes", String(totalBytes));
            console.log(
              `${dryRun ? "Would prune" : "Pruned"} ${totalPruned} eligible entries ` +
              `(${(totalBytes / 1024 / 1024 / 1024).toFixed(2)} GB)`
            );

      - name: Hard cap — prune stale generations while protecting shapes
        if: steps.gate.outputs.needed == 'true'
        id: hard-cap
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs['dry-run'] }}
          COUNT_PRUNED_IDS: ${{ steps.count-prune.outputs.pruned-cache-ids }}
        with:
          script: |
            // Never delete the newest cache for a live restore shape or an
            // unlisted foundation family. If unique protected caches remain
            // above budget, fail rather than deleting those caches.
            const TARGET_GB = 9.5;
            const dryRun = process.env.DRY_RUN === "true";
            const plannedIds = new Set(JSON.parse(process.env.COUNT_PRUNED_IDS || "[]"));
            const { planHardCap } = require(
              `${process.env.GITHUB_WORKSPACE}/ci/cache_cleanup_plan.js`
            );
            const repo = context.repo;
            let caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { ...repo, per_page: 100, sort: "created_at", direction: "desc" }
            );
            let projectedBytes = caches.reduce((sum, cache) => sum + cache.size_in_bytes, 0);
            if (dryRun) {
              projectedBytes -= caches
                .filter(cache => plannedIds.has(cache.id))
                .reduce((sum, cache) => sum + cache.size_in_bytes, 0);
            }
            const targetBytes = TARGET_GB * 1000 * 1000 * 1000;
            const plan = planHardCap(
              caches,
              projectedBytes,
              targetBytes,
              Array.from(plannedIds),
            );
            const sizeGb = projectedBytes / 1000 / 1000 / 1000;
            console.log(`After count-prune: ${sizeGb.toFixed(2)} GB. Target: ${TARGET_GB} GB.`);
            console.log(`${plan.selected.length} additional stale generations eligible.`);
            let extraPruned = 0;
            let extraBytes = 0;
            for (const c of plan.selected) {
              if (dryRun) {
                plannedIds.add(c.id);
                projectedBytes -= c.size_in_bytes;
                extraBytes += c.size_in_bytes;
                extraPruned += 1;
                console.log(
                  `  Would hard-cap delete ${c.key} (id ${c.id}, ` +
                  `${(c.size_in_bytes / 1024 / 1024).toFixed(0)} MB, ${c.ref}, age ` +
                  `${((Date.now() - new Date(c.created_at).getTime()) / 3600000).toFixed(1)}h)`
                );
                continue;
              }
              try {
                await github.rest.actions.deleteActionsCacheById({
                  ...repo,
                  cache_id: c.id,
                });
                projectedBytes -= c.size_in_bytes;
                extraBytes += c.size_in_bytes;
                extraPruned += 1;
                console.log(
                  `  Hard-cap deleted ${c.key} ` +
                  `(${(c.size_in_bytes / 1024 / 1024).toFixed(0)} MB, age ` +
                  `${((Date.now() - new Date(c.created_at).getTime()) / 3600000).toFixed(1)}h)`
                );
              } catch (err) {
                if (err.status === 404) {
                  projectedBytes -= c.size_in_bytes;
                  continue;
                }
                throw err;
              }
            }
            core.setOutput("extra-pruned-bytes", String(extraBytes));
            console.log(
              `Hard cap: ${dryRun ? "would prune" : "pruned"} ${extraPruned} additional entries ` +
              `(${(extraBytes / 1024 / 1024 / 1024).toFixed(2)} GB recovered)`
            );
            const { effectiveCacheBytes } = require(
              `${process.env.GITHUB_WORKSPACE}/ci/cache_cleanup_plan.js`
            );
            let finalBytes = 0;
            let withinBudget = false;
            const maxAttempts = dryRun ? 1 : 6;
            for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
              const [usage, finalCaches] = await Promise.all([
                github.rest.actions.getActionsCacheUsage(repo),
                github.paginate(
                  github.rest.actions.getActionsCacheList,
                  { ...repo, per_page: 100 }
                ),
              ]);
              const listedBytes = finalCaches.reduce(
                (sum, cache) => sum + cache.size_in_bytes,
                0,
              );
              if (dryRun) {
                const plannedBytes = finalCaches
                  .filter(cache => plannedIds.has(cache.id))
                  .reduce((sum, cache) => sum + cache.size_in_bytes, 0);
                const projectedListedBytes = Math.max(0, listedBytes - plannedBytes);
                const projectedUsageBytes = Math.max(
                  0,
                  usage.data.active_caches_size_in_bytes - plannedBytes,
                );
                finalBytes = effectiveCacheBytes(projectedUsageBytes, projectedListedBytes);
              } else {
                finalBytes = effectiveCacheBytes(
                  usage.data.active_caches_size_in_bytes,
                  listedBytes,
                );
              }
              withinBudget = finalBytes <= targetBytes;
              console.log(
                `Final cache snapshot ${attempt + 1}/${maxAttempts}: ` +
                `${(finalBytes / 1000 / 1000 / 1000).toFixed(2)} GB ` +
                `(usage endpoint ${(usage.data.active_caches_size_in_bytes / 1000 / 1000 / 1000).toFixed(2)} GB, ` +
                `listed ${(listedBytes / 1000 / 1000 / 1000).toFixed(2)} GB).`
              );
              if (withinBudget || dryRun || attempt + 1 === maxAttempts) break;
              // The usage endpoint may lag cache deletions. Give it time to
              // converge, but never report green while either source is over.
              await new Promise(resolve => setTimeout(resolve, 10_000));
            }
            if (!withinBudget) {
              core.setFailed(
                `Unique protected cache shapes remain above ${TARGET_GB} GB ` +
                `(${(Math.max(finalBytes, plan.projectedBytes) / 1000 / 1000 / 1000).toFixed(2)} GB after ` +
                `${maxAttempts} cache-list/usage snapshots); ` +
                `no current shape or foundation cache was deleted.`
              );
            }

      - name: Report repo cache usage
        if: steps.gate.outputs.needed == 'true'
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs['dry-run'] }}
          COUNT_PRUNED_BYTES: ${{ steps.count-prune.outputs.pruned-bytes }}
          HARD_CAP_PRUNED_BYTES: ${{ steps.hard-cap.outputs.extra-pruned-bytes }}
        with:
          script: |
            const dryRun = process.env.DRY_RUN === "true";
            const plannedBytes =
              Number(process.env.COUNT_PRUNED_BYTES || "0") +
              Number(process.env.HARD_CAP_PRUNED_BYTES || "0");
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { ...context.repo, per_page: 100 }
            );
            const listedBytes = caches.reduce((sum, cache) => sum + cache.size_in_bytes, 0);
            if (dryRun) {
              const projected = listedBytes - plannedBytes;
              console.log(
                `Dry run: no cache was deleted. Projected repo usage after ` +
                `the listed targets: ${(projected / 1024 / 1024 / 1024).toFixed(2)} GB.`
              );
              return;
            }
            console.log(
              `Repo cache after cleanup: ${caches.length} entries, ` +
              `${(listedBytes / 1000 / 1000 / 1000).toFixed(2)} GB`
            );
