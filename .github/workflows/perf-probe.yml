name: Perf Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-header-trace:
    name: C header-trace probe
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: zackees/setup-soldr@01aea6d47db8fedcafd350e2d42e19290c68824e
        with:
          zccache-seed-strict: true
          cache: false
          linker: fast

      - name: Install Clang and sccache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang
          curl --fail --silent --location \
            https://github.com/mozilla/sccache/releases/download/v0.10.0/sccache-v0.10.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C /tmp sccache-v0.10.0-x86_64-unknown-linux-musl/sccache
          install -m 0755 /tmp/sccache /usr/local/bin/sccache

      # Diagnostic only: this has live test output and a dedicated timeout.
      # It is not the repository's authoritative local Docker timing gate.
      - name: Run C zccache-vs-bare benchmark
        shell: bash
        run: |
          set -euo pipefail
          timeout 20m soldr --no-cache cargo test -p zccache --test perf_bench_test -- \
            perf_c_zccache_vs_bare --nocapture --ignored --test-threads=1
