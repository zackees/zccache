name: CI Check Cross

# Rust-only cross-compile check, used by the musl matrix entries in
# ci-linux.yml. Simpler than ci-check.yml because:
#   - No `cargo test` phase: musl tests would need host-arch + glibc
#     runtime accommodations beyond the matrix coverage goal.
#   - No isolated SOLDR_CACHE_DIR: there's no self-test phase to
#     daemon-isolate against.
#
# The point of the musl lanes is to prove the workspace COMPILES
# cleanly against the musl target. Tests + integration coverage live
# in the native-glibc Linux lanes.
#
# setup-soldr owns target installation and validation through its
# cross-targets input. The action installs and probes the target in its
# managed toolchain, so this workflow does not mutate toolchain state.
# We still install musl-tools because the native musl linker is required.

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      target:
        required: true
        type: string
      label:
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check (${{ inputs.label }})
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Wait for current-main cache pre-prune
        uses: ./.github/actions/wait-cache-pre-prune
      # The newer action revision regresses native ARM-musl compiler selection
      # (GNU std paired with a musl linker). Keep this unrelated cross-only
      # lane on its last known-good action while ci-test consumers use v0.
      - uses: zackees/setup-soldr@a07bab94f16124b5c6857b137a237a53a61e06d1 # v0.9.82
        with:
          cook-delta: false # per-commit delta layer off (setup-soldr#528)
          # Local act runs (bosn; pull_request events) save fully; GitHub keeps
          # the #1677 main-push-only rule. See SAVE_CACHE_POLICY in ci/check_cache_footprint.py.
          save-cache: ${{ env.ACT && 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'auto' || 'false') }}
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          # Cross-target closure: justified in ci/check_cache_footprint.py.
          cache-key-suffix: check-${{ inputs.label }}
          linker: fast
          cross-targets: ${{ inputs.target }}
          prebuild-deps: soldr-cook
          prebuild-deps-flags: ""
          verify-compile-cache: warn
          solo-toolchain-cache: false # #1677 retires the standalone toolchain archive.
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check
        shell: bash
        run: |
          start=$SECONDS
          soldr cargo check --workspace --target ${{ inputs.target }}
          status=$?
          dur=$((SECONDS - start))
          echo "- **${{ inputs.label }} / Check**: ${dur}s" >> "$GITHUB_STEP_SUMMARY"
          exit $status
