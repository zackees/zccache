name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR events
# key on run_id so each gets its own group -- GitHub keeps only ONE pending
# run per group, so a shared group silently drops queued main-push SHAs.
# Workflow-level floor. The msrv job overrides this with its own block
# (job-level permissions replace, not merge) because it needs
# actions: write for cache eviction.
permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  cache-pre-prune:
    name: Cache pre-prune barrier
    uses: ./.github/workflows/wait-cache-pre-prune.yml
    permissions:
      actions: read
      contents: read

  fmt:
    name: Formatting
    needs: cache-pre-prune
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Wait for current-main cache pre-prune
        uses: ./.github/actions/wait-cache-pre-prune
      - uses: zackees/setup-soldr@4df8db93438594f50505574d9dc8117505d33362 # v0.9.80
        with:
          cook-delta: false # per-commit delta layer off (setup-soldr#528)
          # Local act runs (bosn; pull_request events) save fully; GitHub keeps
          # the #1677 main-push-only rule. See SAVE_CACHE_POLICY in ci/check_cache_footprint.py.
          save-cache: ${{ env.ACT && 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'auto' || 'false') }}
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          build-cache: false
          linker: fast
          prebuild-deps: none
          # #1677: standalone toolchain snapshots retain too much data for
          # their measured 7-11s install-time saving; install normally.
          solo-toolchain-cache: false # #1677 retires the standalone toolchain archive.
      - name: Check formatting
        run: soldr cargo fmt --all -- --check
      - name: Strict benchmark metric type check
        run: uvx --from pyright==1.1.411 pyright
      - name: Benchmark report contract tests
        run: |
          PYTHONPATH=. uv run --no-project --python 3.13 \
            --with pytest --with pillow \
            pytest -q ci/tests/test_benchmark_metrics.py ci/tests/test_benchmark_stats.py
      - name: Check log-audit registry snapshot
        run: uv run python ci/check_log_audit_registry.py
      - name: Check setup-soldr cache footprint
        run: uv run --no-project --with pyyaml python ci/check_cache_footprint.py
      - name: Check kernal-api migration inventory
        run: uv run --no-project python ci/check_kernal_api_baseline.py

  dylint:
    name: Dylint
    needs: cache-pre-prune
    runs-on: ubuntu-latest
    env:
      # Dylint removes RUSTUP_TOOLCHAIN before its nested driver build. The
      # cargo shim below pins both cargo and rustc without changing the shared
      # CARGO_HOME cache.
      CARGO_ENV_RUSTUP_TOOLCHAIN: nightly-2026-05-28
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Wait for current-main cache pre-prune
        uses: ./.github/actions/wait-cache-pre-prune
      - id: setup-soldr
        uses: zackees/setup-soldr@4df8db93438594f50505574d9dc8117505d33362 # v0.9.80
        with:
          cook-delta: false # per-commit delta layer off (setup-soldr#528)
          save-cache: ${{ env.ACT && 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'auto' || 'false') }}
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          cargo-registry-cache: false
          # Distinct cache identity (#1677): the Dylint suffix is retained for
          # the driver/profile, but its measured cook archive costs 599 MB.
          # Registry caching is disabled for this lane as before.
          cache-key-suffix: dylint
          linker: fast
          prebuild-deps: none
          # The Dylint cache retains its exact nightly driver/tool profile;
          # this lane skips only the low-return Cargo cook-base archive.
          ci-tests: true
          dylint: true
          dylint-cache: true
          solo-toolchain-cache: false # #1677 retires the standalone toolchain archive.
          dylint-toolchain: nightly-2026-05-28
          cargo-dylint-version: 6.0.3
          dylint-link-version: 6.0.3
      - name: Prepare published Dylint tools
        run: |
          env -u RUSTUP_TOOLCHAIN SOLDR_DYLINT_TOOLCHAIN=nightly-2026-05-28 soldr dylint prepare 2>&1 | tee "$RUNNER_TEMP/dylint-prepare.log"
          sed -n 's/^soldr: dylint prepare: tool bin dir //p' "$RUNNER_TEMP/dylint-prepare.log" >> "$GITHUB_PATH"
      - name: Configure Dylint driver Cargo shim
        run: |
          shim_dir="${RUNNER_TEMP}/dylint-cargo-shim"
          mkdir -p "${shim_dir}"
          nightly_bin="$(dirname "$(soldr rustup which --toolchain nightly-2026-05-28 rustc)")"
          nightly_toolchain="$(basename "$(dirname "${nightly_bin}")")"
          printf '#!/usr/bin/env bash\nsubcommand="ru""stup"\nunset IN_SOLDR_PID\nexport RUSTUP_TOOLCHAIN="%s"\nexec soldr "${subcommand}" run "%s" cargo "$@"\n' "${nightly_toolchain}" "${nightly_toolchain}" > "${shim_dir}/cargo"
          chmod +x "${shim_dir}/cargo"
          echo "DYLINT_CARGO_SHIM=${shim_dir}" >> "${GITHUB_ENV}"
          echo "${shim_dir}" >> "${GITHUB_PATH}"
      - name: Install Dylint nightly toolchain
        run: soldr rustup toolchain install nightly-2026-05-28 --component llvm-tools-preview --component rust-src --component rustc-dev --target x86_64-unknown-linux-gnu --target x86_64-pc-windows-msvc --target aarch64-apple-darwin --profile minimal
      - name: Install stable Rust components
        run: soldr rustup component add rustfmt
      - name: Check Dylint wiring
        run: uv run python ci/check_dylint_wiring.py
      - name: Check Dylint Library Formatting (ban_std_pathbuf)
        run: soldr cargo fmt --manifest-path dylints/ban_std_pathbuf/Cargo.toml --all -- --check
      - name: Check Dylint Library Formatting (ban_unrooted_tempdir)
        run: soldr cargo fmt --manifest-path dylints/ban_unrooted_tempdir/Cargo.toml --all -- --check
      - name: Check Dylint Library Formatting (ban_tmp_literal)
        run: soldr cargo fmt --manifest-path dylints/ban_tmp_literal/Cargo.toml --all -- --check
      - name: Check Dylint Library Formatting (ban_raw_subprocess_in_daemon)
        run: soldr cargo fmt --manifest-path dylints/ban_raw_subprocess_in_daemon/Cargo.toml --all -- --check
      - name: Check Dylint Library Formatting (ban_legacy_artifact_path)
        run: soldr cargo fmt --manifest-path dylints/ban_legacy_artifact_path/Cargo.toml --all -- --check
      - name: Check Dylint Library Formatting (ban_normalized_path_deref_containment)
        run: soldr cargo fmt --manifest-path dylints/ban_normalized_path_deref_containment/Cargo.toml --all -- --check
      - name: Test Dylint Library (ban_std_pathbuf)
        # All lint libraries share one target dir, so their common
        # dylint_linting / clippy_utils / dylint_testing deps build once.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dylint-library-tests
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-28 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-28
          soldr rustup run nightly-2026-05-28 cargo test --manifest-path dylints/ban_std_pathbuf/Cargo.toml
      - name: Test Dylint Library (ban_unrooted_tempdir)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dylint-library-tests
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-28 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-28
          soldr rustup run nightly-2026-05-28 cargo test --manifest-path dylints/ban_unrooted_tempdir/Cargo.toml
      - name: Test Dylint Library (ban_tmp_literal)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dylint-library-tests
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-28 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-28
          soldr rustup run nightly-2026-05-28 cargo test --manifest-path dylints/ban_tmp_literal/Cargo.toml
      - name: Test Dylint Library (ban_raw_subprocess_in_daemon)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dylint-library-tests
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-28 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-28
          soldr rustup run nightly-2026-05-28 cargo test --manifest-path dylints/ban_raw_subprocess_in_daemon/Cargo.toml
      - name: Test Dylint Library (ban_legacy_artifact_path)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dylint-library-tests
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-28 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-28
          soldr rustup run nightly-2026-05-28 cargo test --manifest-path dylints/ban_legacy_artifact_path/Cargo.toml
      - name: Test Dylint Library (ban_normalized_path_deref_containment)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dylint-library-tests
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-28 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-28
          soldr rustup run nightly-2026-05-28 cargo test --manifest-path dylints/ban_normalized_path_deref_containment/Cargo.toml
      - name: Check Dylint Library Formatting (ban_dashmap_guard_across_blocking)
        run: soldr cargo fmt --manifest-path dylints/ban_dashmap_guard_across_blocking/Cargo.toml --all -- --check
      - name: Test Dylint Library (ban_dashmap_guard_across_blocking)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dylint-library-tests
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-28 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-28
          soldr rustup run nightly-2026-05-28 cargo test --manifest-path dylints/ban_dashmap_guard_across_blocking/Cargo.toml
      - name: Check Dylint Library Formatting (ban_discarded_write_result)
        run: soldr cargo fmt --manifest-path dylints/ban_discarded_write_result/Cargo.toml --all -- --check
      - name: Test Dylint Library (ban_discarded_write_result)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dylint-library-tests
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-28 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-28
          soldr rustup run nightly-2026-05-28 cargo test --manifest-path dylints/ban_discarded_write_result/Cargo.toml
      - name: Check Dylint Library Formatting (enforce_platform_boundary)
        run: soldr cargo fmt --manifest-path dylints/enforce_platform_boundary/Cargo.toml --all -- --check
      - name: Check Dylint Library Formatting (ban_registered_env_read)
        run: soldr cargo fmt --manifest-path dylints/ban_registered_env_read/Cargo.toml --all -- --check
      - name: Test Dylint Library (enforce_platform_boundary)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dylint-library-tests
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-28 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-28
          soldr rustup run nightly-2026-05-28 cargo test --manifest-path dylints/enforce_platform_boundary/Cargo.toml
      - name: Test Dylint Library (ban_registered_env_read)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dylint-library-tests
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-28 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-28
          soldr rustup run nightly-2026-05-28 cargo test --manifest-path dylints/ban_registered_env_read/Cargo.toml
      - name: Run Dylint
        # Each lint crate uses dylint-link, so the published Soldr driver can
        # build all ten libraries once without an alias-repair retry loop.
        # ci.lint runs the Linux host pass plus one cross-target pass per
        # other OS: late lints only see cfg-selected code (#1740).
        run: uv run python -m ci.lint --dylint-only
      - name: Prove custom-lint selection for every OS
        working-directory: ci/dylint-target-fixture
        run: |
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin; do
            set +e
            env -u RUSTUP_TOOLCHAIN -u RUSTFLAGS SOLDR_DYLINT_TOOLCHAIN=nightly-2026-05-28 SOLDR_FORCE_MANAGED_CARGO_SUBCOMMANDS=1 soldr dylint --all -- --features violate --target "$target" 2>&1 | tee "$RUNNER_TEMP/dylint-negative-$target.log"
            status=${PIPESTATUS[0]}
            set -e
            test "$status" -ne 0
            grep -Fq 'use zccache_core::path::NormalizedPath instead of std::path::PathBuf' "$RUNNER_TEMP/dylint-negative-$target.log"
            env -u RUSTUP_TOOLCHAIN -u RUSTFLAGS SOLDR_DYLINT_TOOLCHAIN=nightly-2026-05-28 SOLDR_FORCE_MANAGED_CARGO_SUBCOMMANDS=1 soldr dylint --all -- --target "$target"
          done

  msrv:
    name: MSRV (1.95.0)
    needs: cache-pre-prune
    runs-on: ubuntu-latest
    # setup-soldr#347: opt this job into post-step cache eviction.
    # actions: write is required for cache.deleteActionsCacheById.
    # contents: read is needed for actions/checkout. Scoping to this
    # one job (vs workflow-level) keeps the permission narrow — only
    # MSRV is the smoke-test surface; other jobs use default
    # permissions and `cache-eviction-policy: disabled` (the default).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
      - name: Wait for current-main cache pre-prune
        uses: ./.github/actions/wait-cache-pre-prune
      - uses: zackees/setup-soldr@4df8db93438594f50505574d9dc8117505d33362 # v0.9.80
        with:
          cook-delta: false # per-commit delta layer off (setup-soldr#528)
          save-cache: ${{ env.ACT && 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'auto' || 'false') }}
          zccache-seed-strict: true
          cache: true
          toolchain: 1.95.0
          linker: fast
          prebuild-deps: soldr-cook
          prebuild-deps-flags: ""
          verify-compile-cache: warn
          # #1677: standalone toolchain snapshots are disabled repo-wide.
          solo-toolchain-cache: false # #1677 retires the standalone toolchain archive.
          # setup-soldr#347 smoke test: have the post-step prune
          # the oldest non-foundation entries when repo cache > 8 GB.
          # This post-step prune stays limited to non-foundation cache
          # families; cache-cleanup.yml retires the disabled solo-toolchain
          # family through its explicit main-only policy.
          cache-eviction-policy: protect-foundations
      - name: Check MSRV
        run: soldr cargo check --workspace
      - name: Verify nested Dylint cache contract
        run: "soldr cargo test -p zccache --test cache_rust daemon_dylint_cache_test:: -- --ignored"

  reflink-e2e:
    name: Reflink e2e
    needs: cache-pre-prune
    # ZCCACHE_MODE on a real btrfs volume: parent/child worktree hits per
    # mode, extent-sharing evidence, cross-device fallback (#1683).
    uses: ./.github/workflows/reflink-e2e.yml

  docs:
    name: Documentation
    needs: cache-pre-prune
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - name: Wait for current-main cache pre-prune
        uses: ./.github/actions/wait-cache-pre-prune
      - uses: zackees/setup-soldr@4df8db93438594f50505574d9dc8117505d33362 # v0.9.80
        with:
          cook-delta: false # per-commit delta layer off (setup-soldr#528)
          save-cache: ${{ env.ACT && 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'auto' || 'false') }}
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          linker: fast
          prebuild-deps: soldr-cook
          prebuild-deps-flags: ""
          verify-compile-cache: warn
          # #1677: standalone toolchain snapshots are disabled repo-wide.
          solo-toolchain-cache: false # #1677 retires the standalone toolchain archive.
      - name: Build docs
        run: soldr cargo doc --workspace --no-deps

  miss-overhead:
    name: Miss overhead budget
    needs: cache-pre-prune
    # zccache#1670: gate per-TU cache-miss overhead (request wall time minus
    # the compiler child's run time). The test needs clang++, which the
    # hosted Ubuntu image provides; the same fixture backs the
    # `miss_overhead` criterion bench.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Wait for current-main cache pre-prune
        uses: ./.github/actions/wait-cache-pre-prune
      - uses: zackees/setup-soldr@4df8db93438594f50505574d9dc8117505d33362 # v0.9.80
        with:
          cook-delta: false # per-commit delta layer off (setup-soldr#528)
          save-cache: ${{ env.ACT && 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'auto' || 'false') }}
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          linker: fast
          prebuild-deps: soldr-cook
          prebuild-deps-flags: ""
          solo-toolchain-cache: false # #1677 retires the standalone toolchain archive.
      - name: Check clang++
        run: clang++ --version
      - name: Run miss-overhead budget
        env:
          # The daemon-core library test build is memory-heavy on hosted runners.
          CARGO_BUILD_JOBS: "1"
          SOLDR_JOBS: "1"
        run: soldr cargo test -p zccache-daemon-core --features test-support --lib miss_overhead_budget -- --ignored --nocapture
