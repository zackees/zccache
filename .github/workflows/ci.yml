name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: zackees/setup-soldr@01aea6d47db8fedcafd350e2d42e19290c68824e
        with:
          # This action ref's default soldr (0.8.13) predates zackees/soldr#1820
          # and GCs live target/ artifacts after every build — which is what
          # made `cargo dylint` fail with "Could not find lib<name>@<toolchain>
          # .so despite successful build": the compiled cdylib was collected
          # between the build and dylint's post-build lookup (and between the
          # workflow's two passes). Pin a post-#1820 soldr.
          version: 0.9.2
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          build-cache: false
          linker: fast
          prebuild-deps: none
          # Re-enabled after setup-soldr#334: rustfmt is now declared
          # in rust-toolchain.toml's `components = ["rustfmt"]`, so
          # setup-soldr installs it during the toolchain phase and
          # the solo-cache snapshot captures both the manifest AND
          # the cargo-fmt binary. Warm restore is consistent.
          solo-toolchain-cache: true
      - name: Check formatting
        run: soldr cargo fmt --all -- --check
      - name: Check log-audit registry snapshot
        run: uv run python ci/check_log_audit_registry.py

  dylint:
    name: Dylint
    runs-on: ubuntu-latest
    env:
      # Dylint removes RUSTUP_TOOLCHAIN before its nested driver build. The
      # cargo shim below pins both cargo and rustc without changing the shared
      # CARGO_HOME cache.
      CARGO_ENV_RUSTUP_TOOLCHAIN: nightly-2026-05-26
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - id: setup-soldr
        uses: zackees/setup-soldr@01aea6d47db8fedcafd350e2d42e19290c68824e
        with:
          # Post-#1820 soldr (see the identical pin above): 0.8.13's live
          # target-artifact GC is what collected the freshly built dylint
          # cdylibs out from under cargo-dylint's post-build lookup.
          version: 0.9.2
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          cargo-registry-cache: false
          cache-key-suffix: dylint
          linker: fast
          prebuild-deps: soldr-cook
          dylint-cache: true
          dylint-toolchain: nightly-2026-05-26
          cargo-dylint-version: 6.0.1
          dylint-link-version: 6.0.1
      - name: Configure Dylint driver Cargo shim
        run: |
          shim_dir="${RUNNER_TEMP}/dylint-cargo-shim"
          mkdir -p "${shim_dir}"
          nightly_bin="$(dirname "$(soldr rustup which --toolchain nightly-2026-05-26 rustc)")"
          nightly_toolchain="$(basename "$(dirname "${nightly_bin}")")"
          printf '#!/usr/bin/env bash\nsubcommand="ru""stup"\nexport RUSTUP_TOOLCHAIN="%s"\nexec soldr "${subcommand}" run "%s" cargo "$@"\n' "${nightly_toolchain}" "${nightly_toolchain}" > "${shim_dir}/cargo"
          chmod +x "${shim_dir}/cargo"
          echo "DYLINT_CARGO_SHIM=${shim_dir}" >> "${GITHUB_ENV}"
          echo "${shim_dir}" >> "${GITHUB_PATH}"
      - name: Install Dylint nightly toolchain
        run: soldr rustup toolchain install nightly-2026-05-26 --component llvm-tools-preview --component rust-src --component rustc-dev --target x86_64-unknown-linux-gnu --profile minimal
      - name: Install stable Rust components
        run: soldr rustup component add rustfmt
      - name: Install Dylint
        if: steps.setup-soldr.outputs.dylint-cache-hit != 'true'
        run: |
          soldr cargo install cargo-dylint --version 6.0.1 --locked
          soldr cargo install dylint-link --version 6.0.1 --locked
      - name: Check Dylint wiring
        run: uv run python ci/check_dylint_wiring.py
      - name: Check Dylint Library Formatting (ban_std_pathbuf)
        run: soldr cargo fmt --manifest-path dylints/ban_std_pathbuf/Cargo.toml --all -- --check
      - name: Check Dylint Library Formatting (ban_unrooted_tempdir)
        run: soldr cargo fmt --manifest-path dylints/ban_unrooted_tempdir/Cargo.toml --all -- --check
      - name: Check Dylint Library Formatting (ban_tmp_literal)
        run: soldr cargo fmt --manifest-path dylints/ban_tmp_literal/Cargo.toml --all -- --check
      - name: Check Dylint Library Formatting (ban_raw_subprocess_in_daemon)
        run: soldr cargo fmt --manifest-path dylints/ban_raw_subprocess_in_daemon/Cargo.toml --all -- --check
      - name: Check Dylint Library Formatting (ban_legacy_artifact_path)
        run: soldr cargo fmt --manifest-path dylints/ban_legacy_artifact_path/Cargo.toml --all -- --check
      - name: Check Dylint Library Formatting (ban_normalized_path_deref_containment)
        run: soldr cargo fmt --manifest-path dylints/ban_normalized_path_deref_containment/Cargo.toml --all -- --check
      - name: Test Dylint Library (ban_std_pathbuf)
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-26 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-26
          soldr rustup run nightly-2026-05-26 cargo test --manifest-path dylints/ban_std_pathbuf/Cargo.toml
      - name: Test Dylint Library (ban_unrooted_tempdir)
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-26 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-26
          soldr rustup run nightly-2026-05-26 cargo test --manifest-path dylints/ban_unrooted_tempdir/Cargo.toml
      - name: Test Dylint Library (ban_tmp_literal)
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-26 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-26
          soldr rustup run nightly-2026-05-26 cargo test --manifest-path dylints/ban_tmp_literal/Cargo.toml
      - name: Test Dylint Library (ban_raw_subprocess_in_daemon)
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-26 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-26
          soldr rustup run nightly-2026-05-26 cargo test --manifest-path dylints/ban_raw_subprocess_in_daemon/Cargo.toml
      - name: Test Dylint Library (ban_legacy_artifact_path)
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-26 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-26
          soldr rustup run nightly-2026-05-26 cargo test --manifest-path dylints/ban_legacy_artifact_path/Cargo.toml
      - name: Test Dylint Library (ban_normalized_path_deref_containment)
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-26 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-26
          soldr rustup run nightly-2026-05-26 cargo test --manifest-path dylints/ban_normalized_path_deref_containment/Cargo.toml
      - name: Check Dylint Library Formatting (ban_dashmap_guard_across_blocking)
        run: soldr cargo fmt --manifest-path dylints/ban_dashmap_guard_across_blocking/Cargo.toml --all -- --check
      - name: Test Dylint Library (ban_dashmap_guard_across_blocking)
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-26 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-26
          soldr rustup run nightly-2026-05-26 cargo test --manifest-path dylints/ban_dashmap_guard_across_blocking/Cargo.toml
      - name: Check Dylint Library Formatting (ban_discarded_write_result)
        run: soldr cargo fmt --manifest-path dylints/ban_discarded_write_result/Cargo.toml --all -- --check
      - name: Test Dylint Library (ban_discarded_write_result)
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-26 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-26
          soldr rustup run nightly-2026-05-26 cargo test --manifest-path dylints/ban_discarded_write_result/Cargo.toml
      - name: Check Dylint Library Formatting (enforce_platform_boundary)
        run: soldr cargo fmt --manifest-path dylints/enforce_platform_boundary/Cargo.toml --all -- --check
      - name: Test Dylint Library (enforce_platform_boundary)
        run: |
          export PATH="${DYLINT_CARGO_SHIM}:${PATH}"
          export RUSTC="$(soldr rustup which --toolchain nightly-2026-05-26 rustc)"
          export RUSTUP_TOOLCHAIN=nightly-2026-05-26
          soldr rustup run nightly-2026-05-26 cargo test --manifest-path dylints/enforce_platform_boundary/Cargo.toml
      - name: Run Dylint
        run: |
          export PATH="${CARGO_HOME}/bin:${PATH}"
          uv run python -m ci.lint --dylint-only

  msrv:
    name: MSRV (1.95.0)
    runs-on: ubuntu-latest
    # setup-soldr#347: opt this job into post-step cache eviction.
    # actions: write is required for cache.deleteActionsCacheById.
    # contents: read is needed for actions/checkout. Scoping to this
    # one job (vs workflow-level) keeps the permission narrow — only
    # MSRV is the smoke-test surface; other jobs use default
    # permissions and `cache-eviction-policy: disabled` (the default).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: zackees/setup-soldr@01aea6d47db8fedcafd350e2d42e19290c68824e
        with:
          # This action ref's default soldr (0.8.13) predates zackees/soldr#1820
          # and GCs live target/ artifacts after every build — which is what
          # made `cargo dylint` fail with "Could not find lib<name>@<toolchain>
          # .so despite successful build": the compiled cdylib was collected
          # between the build and dylint's post-build lookup (and between the
          # workflow's two passes). Pin a post-#1820 soldr.
          version: 0.9.2
          zccache-seed-strict: true
          cache: true
          toolchain: 1.95.0
          cache-key-suffix: msrv
          linker: fast
          prebuild-deps: soldr-cook
          prebuild-deps-flags: ""
          verify-compile-cache: warn
          # setup-soldr#305: see Formatting job comment above.
          solo-toolchain-cache: true
          # setup-soldr#347 smoke test: have the post-step prune
          # the oldest non-foundation entries when repo cache > 8 GB.
          # Foundation prefixes (solo-toolchain, cargo-registry,
          # soldr-mini, setup-cache) are never touched. This lets the
          # eviction policy do the work the cache-cleanup.yml workflow
          # previously handled, but in-band per CI run.
          cache-eviction-policy: protect-foundations
      - name: Check MSRV
        run: soldr cargo check --workspace
      - name: Verify nested Dylint cache contract
        run: soldr cargo test -p zccache --test daemon_dylint_cache_test -- --ignored

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: zackees/setup-soldr@01aea6d47db8fedcafd350e2d42e19290c68824e
        with:
          # This action ref's default soldr (0.8.13) predates zackees/soldr#1820
          # and GCs live target/ artifacts after every build — which is what
          # made `cargo dylint` fail with "Could not find lib<name>@<toolchain>
          # .so despite successful build": the compiled cdylib was collected
          # between the build and dylint's post-build lookup (and between the
          # workflow's two passes). Pin a post-#1820 soldr.
          version: 0.9.2
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          cache-key-suffix: docs
          linker: fast
          prebuild-deps: soldr-cook
          prebuild-deps-flags: ""
          verify-compile-cache: warn
          # setup-soldr#305: see Formatting job comment above.
          solo-toolchain-cache: true
      - name: Build docs
        run: soldr cargo doc --workspace --no-deps
