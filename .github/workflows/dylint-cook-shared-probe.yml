name: Dylint shared cook-base probe

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dylint:
    name: Dylint with shared cook base (restore-only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Set up stable toolchain without cache layers
        uses: zackees/setup-soldr@4df8db93438594f50505574d9dc8117505d33362 # v0.9.80
        with:
          cache: false
          toolchain: 1.95.0
          prebuild-deps: none
      - name: Restore generic main cook base and run cook without saving
        uses: zackees/setup-soldr/cook@4df8db93438594f50505574d9dc8117505d33362 # v0.9.80
        with:
          workspace: .
          target-dir: target
          flags: --release
          save-cache: false
      - name: Install Dylint toolchain and tools
        run: |
          soldr rustup toolchain install nightly-2026-05-26 --component llvm-tools-preview --component rust-src --component rustc-dev --target x86_64-unknown-linux-gnu --profile minimal
          if ! command -v cargo-dylint >/dev/null 2>&1; then
            soldr cargo install cargo-dylint --version 6.0.1 --locked
          fi
          if ! command -v dylint-link >/dev/null 2>&1; then
            soldr cargo install dylint-link --version 6.0.1 --locked
          fi
      - name: Test Dylint libraries on nightly
        shell: bash
        run: |
          for manifest in \
            dylints/ban_std_pathbuf/Cargo.toml \
            dylints/ban_unrooted_tempdir/Cargo.toml \
            dylints/ban_tmp_literal/Cargo.toml \
            dylints/ban_raw_subprocess_in_daemon/Cargo.toml \
            dylints/ban_legacy_artifact_path/Cargo.toml \
            dylints/ban_normalized_path_deref_containment/Cargo.toml \
            dylints/ban_dashmap_guard_across_blocking/Cargo.toml \
            dylints/ban_discarded_write_result/Cargo.toml \
            dylints/enforce_platform_boundary/Cargo.toml \
            dylints/ban_registered_env_read/Cargo.toml; do
            RUSTC="$(soldr rustup which --toolchain nightly-2026-05-26 rustc)" \
              RUSTUP_TOOLCHAIN=nightly-2026-05-26 \
              soldr rustup run nightly-2026-05-26 cargo test --manifest-path "$manifest"
          done
      - name: Run Dylint checks
        run: |
          export ZCCACHE_DISABLE=1
          uv run --no-project python -m ci.lint --dylint-only
