name: Filesystem Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"

permissions:
  actions: read
  contents: read

concurrency:
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: fs-matrix-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        with:
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          cache-key-suffix: fs-matrix-${{ matrix.os }}
          linker: fast
      - name: Install Linux filesystem tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y btrfs-progs dosfstools e2fsprogs
      - name: Report disk space (Windows diagnostic)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
      - name: Run capability and behavior matrix
        shell: bash
        env:
          ZCCACHE_REQUIRE_FS_MATRIX: "1"
          # GitHub-hosted Windows runners keep the checkout/build on the
          # roomy D: drive (via RUNNER_TEMP / the workspace path) but
          # tempfile::tempdir() defaults to C:\Users\...\AppData\Local\Temp
          # when TEMP/TMP aren't set — a much smaller volume. The refs-vhdx
          # row's `diskpart create vdisk` was intermittently failing there
          # with "There is not enough space on the disk" even for a small
          # dynamic VHDX. Point TEMP/TMP at RUNNER_TEMP (same drive as the
          # workspace) so VHDX images land on the drive with real headroom.
          # No-op on Linux/macOS, which use TMPDIR instead.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          # This compiles the daemon-core library test on each hosted OS.
          CARGO_BUILD_JOBS: "1"
          SOLDR_JOBS: "1"
        run: >-
          soldr cargo test -p zccache-daemon-core --features test-support
          filesystem_materialization_matrix_prints_loud_summary -- --nocapture --test-threads=1
      - name: ReFS cluster-rounding acceptance
        if: runner.os == 'Windows'
        shell: bash
        env:
          ZCCACHE_REQUIRE_REFS: "1"
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          CARGO_BUILD_JOBS: "1"
          SOLDR_JOBS: "1"
        run: >-
          soldr cargo test -p zccache-daemon-core --features test-support
          refs_non_cluster_multiple_round_trips -- --nocapture --test-threads=1

  observe-macos-queue:
    name: Observe macOS runner queue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Bound macOS queue starvation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python 3.13 python ci/observe_runner_queue.py
          --repository "${{ github.repository }}" --run-id "${{ github.run_id }}"
          --runner macos-15 --job "matrix (macos-15)" --token "$GITHUB_TOKEN"

  large-cow:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        with:
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          cache-key-suffix: fs-large-cow-${{ matrix.os }}
          linker: fast
      - name: Install btrfs fixture tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y btrfs-progs
      - name: Run required >4 GiB COW acceptance
        shell: bash
        env:
          ZCCACHE_REQUIRE_LARGE_COW: "1"
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          CARGO_BUILD_JOBS: "1"
          SOLDR_JOBS: "1"
        run: >-
          soldr cargo test -p zccache-daemon-core --features test-support
          reflink_larger_than_four_gib_uses_chunked_clone -- --nocapture --test-threads=1
