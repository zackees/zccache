name: Integration

# Linux-only full `cargo test --workspace --no-fail-fast`, including the
# integration test binaries under `crates/*/tests/`. Most of those tests
# are #[ignore]'d, but the binaries themselves are still compiled — which
# costs ~4 minutes on Windows MSVC per run (see issue #106). The platform
# Check / Test workflows in `ci-check.yml` therefore only run `--lib --bins`;
# this workflow restores the cross-binary integration coverage on the
# fastest platform (Linux).

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 0"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"

permissions:
  actions: read
  contents: read

concurrency:
  # Keep scheduled/manual discovery runs together while separating them from
  # normal push/PR gates on the same ref.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  ZCCACHE_INTEGRATION_FEATURES: "zccache/zccache-bin,zccache/daemon-bin,zccache/download-bin,zccache/download-daemon-bin,zccache/fingerprint-bin,zccache/stamp-bin,zccache/ci-bin,zccache/crash-tools,zccache/tokio-console,zccache/test-support,zccache/heap-profile"

jobs:
  # zackees/ci.yml#166/#190/#198 (GATE-002/003/008/010): decides, from the
  # PR base's local-gate.toml and ci-attestations.yml, whether this PR head
  # carries a valid local-gate attestation for every gate of a skippable
  # job. `skip_<job>` is 'true' only for an attested, in-policy PR head;
  # never on push/dispatch/schedule, so main always runs every job (the
  # post-merge catch). [gate] mode = "shadow": an unattested head is
  # reported here, not failed. The ref is ci/local_gate.py's CI_LINT_REF
  # (ci/tests/test_local_gate.py keeps the two in step).
  ci-mode:
    name: CI mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trusted: ${{ steps.gate.outputs.trusted }}
      skip_integration: ${{ steps.gate.outputs.skip_integration }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Full history: GATE-008 reads the base commit's local-gate.toml
          # and diffs the PR from its merge base.
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: zackees/ci.yml
          ref: 365508627edb8130e2c5615338b00bf02a069fa7
          path: .ci-lint
          persist-credentials: false
          sparse-checkout: ci_lint
      - name: Local gate attestation
        id: gate
        run: PYTHONPATH=.ci-lint python3 -m ci_lint local-gate verify --repo . --trust --github-output

  cache-pre-prune:
    name: Cache pre-prune barrier
    uses: ./.github/workflows/wait-cache-pre-prune.yml
    permissions:
      actions: read
      contents: read

  integration:
    needs: [cache-pre-prune, ci-mode]
    # GATE-008/010: skipped only for a PR head attested by the local gate's
    # isolated `tests` lane, which replays this workflow through Bosn
    # and verifies source-bound executed-step evidence; main pushes run it.
    if: ${{ needs.ci-mode.outputs.skip_integration != 'true' }}
    name: Integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Wait for current-main cache pre-prune
        uses: ./.github/actions/wait-cache-pre-prune
      - uses: astral-sh/setup-uv@v6
      - id: soldr
        uses: zackees/setup-soldr@v0 # v0.9.82 or later (floating major)
        with:
          job-status: ${{ job.status }} # setup-soldr#559: a failed job saves no build outputs
          cache-key-suffix: integration # isolated full-workspace profile (#1885/#1867)
          cook-delta: false # per-commit delta layer off (setup-soldr#528)
          # Global auto keeps local saves warm; the remote permission preserves
          # the #1677 current-main pre-prune guard (setup-soldr#565).
          save-cache: auto
          save-cache-remote: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ZCCACHE_CACHE_WRITES == 'true' && 'auto' || 'false' }}
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          linker: fast
          # #1885: the isolated unit store reuses dependencies and workspace
          # units. A setup cook here runs under a different cache root and
          # saved a 3.53 GB post-build archive in the measured cold replay.
          # Keep that duplicate target archive out of the cook family.
          prebuild-deps: none
          cargo-registry-cache: true
          ci-tests: true # linked test products stay outside every cache layer
          # #240: seed the isolated integration SOLDR_CACHE_DIR from the
          # restored build-cache so the daemon-isolated test phase starts warm.
          seed-isolated-build-cache: ${{ runner.temp }}/zccache-self-tests/integration
          verify-compile-cache: warn
          # #1677: install the pinned toolchain normally; the standalone
          # cache's measured saving did not justify its footprint.
          solo-toolchain-cache: false # #1677 retires the standalone toolchain archive.
      - name: Build integration test binaries
        shell: bash
        env:
          # Build through the same isolated cache and zccache wrapper as the
          # test step. Cargo fingerprints the rustc wrapper, so a prebuild with
          # ZCCACHE_DISABLE=1 was invalidated wholesale: the test step then
          # recompiled all ~355 crates on one core (~4 min).
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          SOLDR_TARGET_BLOCK_FREE_GB: "2"
          # Full-parallel compile on a loaded hosted runner can take >2 s to
          # get the broker's first response (zackees/soldr#3449).
          SOLDR_BROKER_FIRST_RESPONSE_MS: "30000"
          # Compile-only (`--no-run`): no test executes here, so the #1532
          # serialization that protects timing-sensitive tests does not apply.
          # CARGO_BUILD_JOBS/SOLDR_JOBS stay unset so the build uses every core.
        run: |
          # The build cache can contain zccache COW materializations, whose
          # artifacts are intentionally read-only while shared with the cache.
          # Setup-soldr restored them outside this isolated cache, so rustc cannot detach them before
          # overwriting a stale output. The restored target tree is private to
          # this runner; make those files writable before invoking rustc.
          if [[ -d target ]]; then
            find target -type f ! -perm -u+w -exec chmod u+w {} +
          fi
          unset ZCCACHE_CACHE_DIR
          soldr cargo test --workspace --features "$ZCCACHE_INTEGRATION_FEATURES" --no-fail-fast --no-run
          soldr cargo build -p zccache --features ci-bin --bin zccache-ci
      - name: Stop setup-soldr builder cache before tests
        uses: zackees/setup-soldr/cleanup@v0 # v0.9.82 or later (floating major)
      - name: Remove seeded runtime journals before tests
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: |
          # The isolated cache is seeded with build artifacts, but runtime
          # journals describe a prior job. Keep the artifacts warm while
          # ensuring the audit below evaluates only this job's behavior.
          uv run --no-project python ci/clear_runtime_telemetry.py \
            --cache-root "$SOLDR_CACHE_DIR/cache/zccache"
      - name: Test (full workspace)
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          SOLDR_TARGET_BLOCK_FREE_GB: "2"
          # Cargo schedules compiler processes separately from the test
          # harness's --test-threads setting. Bound both admission layers for
          # the daemon-core lib test on the hosted runner.
          CARGO_BUILD_JOBS: "1"
          SOLDR_JOBS: "1"
        run: |
          set +e
          unset ZCCACHE_CACHE_DIR
          echo "Using isolated test SOLDR_CACHE_DIR=$SOLDR_CACHE_DIR"
          start=$SECONDS
          # nextest runs each test in its own process, so tests execute in
          # parallel without sharing in-process state. It does not run
          # doctests; the second command covers them.
          soldr cargo nextest run --workspace --features "$ZCCACHE_INTEGRATION_FEATURES" --no-fail-fast 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          soldr cargo test --workspace --features "$ZCCACHE_INTEGRATION_FEATURES" --no-fail-fast --doc 2>&1 | tee -a test-output.txt
          doc_status=${PIPESTATUS[0]}
          [ $status -eq 0 ] && status=$doc_status
          dur=$((SECONDS - start))
          echo "- **Integration (Linux)**: ${dur}s" >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            {
              echo '## Integration Test Failures'
              echo '```'
              grep -E '^\s+(FAIL|SIGSEGV|SIGABRT|TIMEOUT) \[' test-output.txt
              awk '/^failures:$/,/^test result:/' test-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
      - name: Remove build-harness journals before strict audit
        if: always()
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: |
          # The full-suite command above can invoke the seeded build wrapper
          # while compiling test harnesses. Those journals describe build
          # orchestration, whereas the strict fixture below owns and audits
          # its own runtime cache. Preserve artifacts but exclude harness
          # telemetry from the integration runtime audit.
          uv run --no-project python ci/clear_runtime_telemetry.py \
            --cache-root "$SOLDR_CACHE_DIR/cache/zccache"
      - name: Wrapper daemon-unavailable contract (exit 125)
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
          # Deliberately NO `ZCCACHE_DISABLE` here. The adjacent
          # artifact-layout step sets it for journal hygiene, and copying that
          # across is what made the first version of this step fail: the
          # wrapper honours the bypass before any endpoint resolution, so both
          # tests ran the tool and mirrored its exit code (7) instead of
          # refusing with 125. A step that verifies "no silent bypass exists"
          # must not set the bypass. The tests now also strip it themselves.
        run: |
          # #1317: these are #[ignore]d (they launch the wrapper binary), and
          # the main run above does not pass --ignored, so the exit-125
          # daemon-unavailable contract documented in CLAUDE.md was verified
          # nowhere. They are the only end-to-end coverage of it: real binary,
          # real exit code, the `zccache[err][D]:` stderr, exactly one durable
          # `wrapper-daemon-unavailable` event, and no local-fallback event.
          #
          # Kept as its own step rather than folded into the main run so a
          # failure here is legible on sight instead of buried in a
          # workspace-wide log.
          unset ZCCACHE_CACHE_DIR
          soldr cargo test -p zccache --features "$ZCCACHE_INTEGRATION_FEATURES" --test cli cli_wrapper_failure_boundaries:: -- --ignored --test-threads=1
      - name: Remove wrapper-contract telemetry before strict audit
        if: always()
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: >
          uv run --no-project python ci/clear_runtime_telemetry.py
          --cache-root "$SOLDR_CACHE_DIR/cache/zccache"
      - name: Strict artifact-layout validation
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
          # This command recompiles its test harness with a feature set that
          # differs from the no-run prebuild. Its Rust wrapper telemetry is
          # build orchestration, not the daemon runtime exercised by the
          # fixture (which owns an independent tempfile cache and audits it
          # directly). Keep those rows out of the integration runtime audit.
          ZCCACHE_DISABLE: "1"
        run: |
          unset ZCCACHE_CACHE_DIR
          soldr cargo test -p zccache-daemon-core --test legacy_path_validation -- --ignored --test-threads=1
      - name: Test ignored integration and stress suite
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          SOLDR_TARGET_BLOCK_FREE_GB: "2"
          # This repeats the full-workspace compilation shape above.
          CARGO_BUILD_JOBS: "1"
          SOLDR_JOBS: "1"
          # zccache#1670's `matches_legacy_on_corpus_dir` checks the
          # single-pass include lexer against the legacy scanner over a real
          # header tree; the runner's system headers are that tree (#1648).
          ZCCACHE_SCAN_CORPUS_DIR: /usr/include
        run: |
          set +e
          unset ZCCACHE_CACHE_DIR
          start=$SECONDS
          timeout 90m soldr cargo test --workspace --features "$ZCCACHE_INTEGRATION_FEATURES" --no-fail-fast -- \
            --ignored --test-threads=1 \
            --skip bench_ --skip perf_ --skip profile_ \
            --skip cold_path_stress_profile --skip cold_path_concurrent_stress \
            --skip cold_path_first_file_penalty --skip persist_pool_bench 2>&1 | tee ignored-test-output.txt
          status=${PIPESTATUS[0]}
          dur=$((SECONDS - start))
          echo "- **Ignored integration/stress (Linux)**: ${dur}s" >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            {
              echo '## Ignored Integration Test Failures'
              echo '```'
              awk '/^failures:$/,/^test result:/' ignored-test-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
      - name: Remove ignored-suite harness journals before strict audit
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: |
          uv run --no-project python ci/clear_runtime_telemetry.py \
            --cache-root "$SOLDR_CACHE_DIR/cache/zccache"
      - name: Stop isolated test cache
        if: always()
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: |
          unset ZCCACHE_CACHE_DIR
          soldr cache shutdown --archive-logs "$SOLDR_CACHE_DIR/cache/zccache/logs/archive" || true
      - name: Audit isolated integration cache
        if: always()
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: |
          target/debug/zccache-ci audit-logs "$SOLDR_CACHE_DIR/cache/zccache" --context integration
      - name: Publish isolated integration build cache
        if: always()
        uses: ./.github/actions/publish-isolated-build-cache
        with:
          isolated-soldr-cache-dir: ${{ runner.temp }}/zccache-self-tests/integration
          build-cache-path: ${{ steps.soldr.outputs.build-cache-path }}
