name: Integration

# Linux-only full `cargo test --workspace --no-fail-fast`, including the
# integration test binaries under `crates/*/tests/`. Most of those tests
# are #[ignore]'d, but the binaries themselves are still compiled — which
# costs ~4 minutes on Windows MSVC per run (see issue #106). The platform
# Check / Test workflows in `ci-check.yml` therefore only run `--lib --bins`;
# this workflow restores the cross-binary integration coverage on the
# fastest platform (Linux).

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 0"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"

concurrency:
  # Keep scheduled/manual discovery runs together while separating them from
  # normal push/PR gates on the same ref.
  group: integration-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'discovery' || github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  ZCCACHE_INTEGRATION_FEATURES: "zccache/zccache-bin,zccache/daemon-bin,zccache/download-bin,zccache/download-daemon-bin,zccache/fingerprint-bin,zccache/stamp-bin,zccache/ci-bin,zccache/crash-tools,zccache/tokio-console,zccache/test-support,zccache/heap-profile"

jobs:
  integration:
    name: Integration (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: zackees/setup-soldr@5f1f68dcb8377818413c28ce52214261ae8ff771
        with:
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          linker: fast
          prebuild-deps: soldr-cook
          prebuild-deps-flags: ""
          # #240: seed the isolated integration SOLDR_CACHE_DIR from the
          # restored build-cache so the daemon-isolated test phase starts warm.
          seed-isolated-build-cache: ${{ runner.temp }}/zccache-self-tests/integration
          verify-compile-cache: warn
          # setup-soldr#305: skip the ~8s `rustup toolchain install` on
          # warm runs by restoring the toolchain delta from a tiny
          # long-lived cache.
          solo-toolchain-cache: true
      - name: Build integration test binaries
        shell: bash
        env:
          # This step only produces binaries for the following test steps.
          # It can rebuild the full workspace when setup-soldr restores a
          # cross-target fallback cache; caching those disposable compiler
          # outputs duplicates target/ and can exhaust the hosted runner.
          # The actual integration tests below still run through zccache.
          ZCCACHE_DISABLE: "1"
          # The no-run workspace prebuild restores a cross-target cache on
          # hosted runners. Its disposable outputs leave roughly 2 GiB free,
          # so use the same guard as the isolated test phase below rather
          # than setup-soldr's 5 GiB default.
          SOLDR_TARGET_BLOCK_FREE_GB: "2"
        run: |
          # The build cache can contain zccache COW materializations, whose
          # artifacts are intentionally read-only while shared with the cache.
          # This prebuild bypasses zccache, so rustc cannot detach them before
          # overwriting a stale output. The restored target tree is private to
          # this runner; make those files writable before invoking rustc.
          if [[ -d target ]]; then
            find target -type f ! -perm -u+w -exec chmod u+w {} +
          fi
          soldr cargo test --workspace --features "$ZCCACHE_INTEGRATION_FEATURES" --no-fail-fast --no-run
          soldr cargo build -p zccache --features ci-bin --bin zccache-ci
      - name: Stop setup-soldr builder cache before tests
        uses: zackees/setup-soldr/cleanup@5f1f68dcb8377818413c28ce52214261ae8ff771
      - name: Remove seeded runtime journals before tests
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: |
          # The isolated cache is seeded with build artifacts, but runtime
          # journals describe a prior job. Keep the artifacts warm while
          # ensuring the audit below evaluates only this job's behavior.
          uv run --no-project python ci/clear_runtime_telemetry.py \
            --cache-root "$SOLDR_CACHE_DIR/cache/zccache"
      - name: Test (full workspace)
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          SOLDR_TARGET_BLOCK_FREE_GB: "2"
        run: |
          set +e
          unset ZCCACHE_CACHE_DIR
          echo "Using isolated test SOLDR_CACHE_DIR=$SOLDR_CACHE_DIR"
          start=$SECONDS
          soldr cargo test --workspace --features "$ZCCACHE_INTEGRATION_FEATURES" --no-fail-fast -- --test-threads=1 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          dur=$((SECONDS - start))
          echo "- **Integration (Linux)**: ${dur}s" >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            {
              echo '## Integration Test Failures'
              echo '```'
              awk '/^failures:$/,/^test result:/' test-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
      - name: Remove build-harness journals before strict audit
        if: always()
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: |
          # The full-suite command above can invoke the seeded build wrapper
          # while compiling test harnesses. Those journals describe build
          # orchestration, whereas the strict fixture below owns and audits
          # its own runtime cache. Preserve artifacts but exclude harness
          # telemetry from the integration runtime audit.
          uv run --no-project python ci/clear_runtime_telemetry.py \
            --cache-root "$SOLDR_CACHE_DIR/cache/zccache"
      - name: Wrapper daemon-unavailable contract (exit 125)
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
          # Deliberately NO `ZCCACHE_DISABLE` here. The adjacent
          # artifact-layout step sets it for journal hygiene, and copying that
          # across is what made the first version of this step fail: the
          # wrapper honours the bypass before any endpoint resolution, so both
          # tests ran the tool and mirrored its exit code (7) instead of
          # refusing with 125. A step that verifies "no silent bypass exists"
          # must not set the bypass. The tests now also strip it themselves.
        run: |
          # #1317: these are #[ignore]d (they launch the wrapper binary), and
          # the main run above does not pass --ignored, so the exit-125
          # daemon-unavailable contract documented in CLAUDE.md was verified
          # nowhere. They are the only end-to-end coverage of it: real binary,
          # real exit code, the `zccache[err][D]:` stderr, exactly one durable
          # `wrapper-daemon-unavailable` event, and no local-fallback event.
          #
          # Kept as its own step rather than folded into the main run so a
          # failure here is legible on sight instead of buried in a
          # workspace-wide log.
          unset ZCCACHE_CACHE_DIR
          soldr cargo test -p zccache --features "$ZCCACHE_INTEGRATION_FEATURES" --test cli_wrapper_failure_boundaries -- --ignored --test-threads=1
      - name: Remove wrapper-contract telemetry before strict audit
        if: always()
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: >
          uv run --no-project python ci/clear_runtime_telemetry.py
          --cache-root "$SOLDR_CACHE_DIR/cache/zccache"
      - name: Strict artifact-layout validation
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
          # This command recompiles its test harness with a feature set that
          # differs from the no-run prebuild. Its Rust wrapper telemetry is
          # build orchestration, not the daemon runtime exercised by the
          # fixture (which owns an independent tempfile cache and audits it
          # directly). Keep those rows out of the integration runtime audit.
          ZCCACHE_DISABLE: "1"
        run: |
          unset ZCCACHE_CACHE_DIR
          soldr cargo test -p zccache-daemon-core --test legacy_path_validation -- --ignored --test-threads=1
      - name: Test ignored integration and stress suite
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          SOLDR_TARGET_BLOCK_FREE_GB: "2"
        run: |
          set +e
          unset ZCCACHE_CACHE_DIR
          start=$SECONDS
          timeout 90m soldr cargo test --workspace --features "$ZCCACHE_INTEGRATION_FEATURES" --no-fail-fast -- \
            --ignored --test-threads=1 \
            --skip bench_ --skip perf_ --skip profile_ \
            --skip cold_path_stress_profile --skip cold_path_concurrent_stress \
            --skip cold_path_first_file_penalty --skip persist_pool_bench 2>&1 | tee ignored-test-output.txt
          status=${PIPESTATUS[0]}
          dur=$((SECONDS - start))
          echo "- **Ignored integration/stress (Linux)**: ${dur}s" >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            {
              echo '## Ignored Integration Test Failures'
              echo '```'
              awk '/^failures:$/,/^test result:/' ignored-test-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
      - name: Remove ignored-suite harness journals before strict audit
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: |
          uv run --no-project python ci/clear_runtime_telemetry.py \
            --cache-root "$SOLDR_CACHE_DIR/cache/zccache"
      - name: Stop isolated test cache
        if: always()
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: |
          unset ZCCACHE_CACHE_DIR
          soldr cache shutdown --archive-logs "$SOLDR_CACHE_DIR/cache/zccache/logs/archive" || true
      - name: Audit isolated integration cache
        if: always()
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: |
          target/debug/zccache-ci audit-logs "$SOLDR_CACHE_DIR/cache/zccache" --context integration
