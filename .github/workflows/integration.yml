name: Integration

# Linux-only full `cargo test --workspace --no-fail-fast`, including the
# integration test binaries under `crates/*/tests/`. Most of those tests
# are #[ignore]'d, but the binaries themselves are still compiled — which
# costs ~4 minutes on Windows MSVC per run (see issue #106). The platform
# Check / Test workflows in `ci-check.yml` therefore only run `--lib --bins`;
# this workflow restores the cross-binary integration coverage on the
# fastest platform (Linux).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  ZCCACHE_INTEGRATION_FEATURES: "zccache/zccache-bin,zccache/daemon-bin,zccache/download-bin,zccache/download-daemon-bin,zccache/fingerprint-bin,zccache/stamp-bin,zccache/ci-bin,zccache/crash-tools,zccache/tokio-console,zccache/test-support"

jobs:
  integration:
    name: Integration (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: zackees/setup-soldr@01aea6d47db8fedcafd350e2d42e19290c68824e
        with:
          zccache-seed-strict: true
          toolchain: 1.94.1
          cache: true
          linker: fast
          prebuild-deps: soldr-cook
          prebuild-deps-flags: ""
          # #240: seed the isolated integration SOLDR_CACHE_DIR from the
          # restored build-cache so the daemon-isolated test phase starts warm.
          seed-isolated-build-cache: ${{ runner.temp }}/zccache-self-tests/integration
          verify-compile-cache: warn
          # setup-soldr#305: skip the ~8s `rustup toolchain install` on
          # warm runs by restoring the toolchain delta from a tiny
          # long-lived cache.
          solo-toolchain-cache: true
      - name: Build integration test binaries
        shell: bash
        env:
          # This step only produces binaries for the following test steps.
          # It can rebuild the full workspace when setup-soldr restores a
          # cross-target fallback cache; caching those disposable compiler
          # outputs duplicates target/ and can exhaust the hosted runner.
          # The actual integration tests below still run through zccache.
          ZCCACHE_DISABLE: "1"
          # The no-run workspace prebuild restores a cross-target cache on
          # hosted runners. Its disposable outputs leave roughly 2 GiB free,
          # so use the same guard as the isolated test phase below rather
          # than setup-soldr's 5 GiB default.
          SOLDR_TARGET_BLOCK_FREE_GB: "2"
        run: |
          soldr cargo test --workspace --features "$ZCCACHE_INTEGRATION_FEATURES" --no-fail-fast --no-run
          soldr cargo build -p zccache --features ci-bin --bin zccache-ci
      - name: Stop setup-soldr builder cache before tests
        uses: zackees/setup-soldr/cleanup@01aea6d47db8fedcafd350e2d42e19290c68824e
      - name: Remove seeded runtime journals before tests
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: |
          # The isolated cache is seeded with build artifacts, but runtime
          # journals describe a prior job. Keep the artifacts warm while
          # ensuring the audit below evaluates only this job's behavior.
          journal_root="$SOLDR_CACHE_DIR/cache/zccache/daemon-state"
          if [[ -d "$journal_root" ]]; then
            find "$journal_root" -type f -path '*/logs/*.jsonl' -print -delete
          fi
      - name: Test (full workspace)
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          SOLDR_TARGET_BLOCK_FREE_GB: "2"
        run: |
          set +e
          unset ZCCACHE_CACHE_DIR
          echo "Using isolated test SOLDR_CACHE_DIR=$SOLDR_CACHE_DIR"
          start=$SECONDS
          soldr cargo test --workspace --features "$ZCCACHE_INTEGRATION_FEATURES" --no-fail-fast -- --test-threads=1 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          dur=$((SECONDS - start))
          echo "- **Integration (Linux)**: ${dur}s" >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            {
              echo '## Integration Test Failures'
              echo '```'
              awk '/^failures:$/,/^test result:/' test-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
      - name: Remove build-harness journals before strict audit
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: |
          # The full-suite command above can invoke the seeded build wrapper
          # while compiling test harnesses. Those journals describe build
          # orchestration, whereas the strict fixture below owns and audits
          # its own runtime cache. Preserve artifacts but exclude harness
          # telemetry from the integration runtime audit.
          journal_root="$SOLDR_CACHE_DIR/cache/zccache/daemon-state"
          if [[ -d "$journal_root" ]]; then
            find "$journal_root" -type f -path '*/logs/*.jsonl' -print -delete
          fi
      - name: Strict artifact-layout validation
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
          # This command recompiles its test harness with a feature set that
          # differs from the no-run prebuild. Its Rust wrapper telemetry is
          # build orchestration, not the daemon runtime exercised by the
          # fixture (which owns an independent tempfile cache and audits it
          # directly). Keep those rows out of the integration runtime audit.
          ZCCACHE_DISABLE: "1"
        run: |
          unset ZCCACHE_CACHE_DIR
          soldr cargo test -p zccache-daemon-core --test legacy_path_validation -- --ignored --test-threads=1
      - name: Stop isolated test cache
        if: always()
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: |
          unset ZCCACHE_CACHE_DIR
          soldr cache shutdown --archive-logs "$SOLDR_CACHE_DIR/cache/zccache/logs/archive" || true
      - name: Audit isolated integration cache
        if: always()
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/integration
        run: |
          target/debug/zccache-ci audit-logs "$SOLDR_CACHE_DIR/cache/zccache" --context integration
