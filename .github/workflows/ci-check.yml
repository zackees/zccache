name: CI Check

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      # `cargo check --workspace` is a strict subset of what the `test` job's
      # `cargo test --workspace --lib --bins --no-run` already compiles on the
      # same OS with the same RUSTFLAGS — it codegens and *links* the lib, the
      # cfg(test) lib, and every bin. On macOS/Windows the extra job buys only
      # a marginally earlier failure signal while consuming a scarce runner
      # slot that queues for 16-32 minutes. Linux keeps it (cheap, unqueued).
      run_check:
        required: false
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    if: inputs.run_check
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Wait for current-main cache pre-prune
        uses: ./.github/actions/wait-cache-pre-prune
      - uses: zackees/setup-soldr@v0 # v0.9.82 or later (floating major)
        with:
          cook-delta: false # per-commit delta layer off (setup-soldr#528)
          # Local act runs (bosn; pull_request events) save fully; GitHub keeps
          # the #1677 main-push-only rule. See SAVE_CACHE_POLICY in ci/check_cache_footprint.py.
          save-cache: ${{ env.ACT && 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'auto' || 'false') }}
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          build-cache: ${{ inputs.os != 'macos-15' }}
          linker: fast
          # Cook bases run on Linux only (zackees/ci.yml#5 RUST-010, #1758).
          prebuild-deps: ${{ startsWith(inputs.os, 'ubuntu') && 'soldr-cook' || 'none' }}
          prebuild-deps-flags: ""
          verify-compile-cache: warn
          # #1677: install the pinned toolchain normally; the standalone
          # cache's 7-11s measured saving did not justify its footprint.
          solo-toolchain-cache: false # #1677 retires the standalone toolchain archive.
      - name: Check
        shell: bash
        run: |
          start=$SECONDS
          soldr cargo check --workspace
          status=$?
          dur=$((SECONDS - start))
          echo "- **${{ inputs.os }} / Check**: ${dur}s" >> "$GITHUB_STEP_SUMMARY"
          exit $status

  test:
    name: Test
    runs-on: ${{ inputs.os }}
    # Without this the job inherits GitHub's 360-minute default, so a hung
    # test holds a scarce macOS/Windows runner slot for six hours. Observed
    # runtime is 2-5 minutes; 45 leaves ample headroom for a cold cache.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Wait for current-main cache pre-prune
        uses: ./.github/actions/wait-cache-pre-prune
      - uses: zackees/setup-soldr@v0 # v0.9.82 or later (floating major)
        with:
          cook-delta: false # per-commit delta layer off (setup-soldr#528)
          save-cache: ${{ env.ACT && 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'auto' || 'false') }}
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          # Windows Test is the PR critical path and ~70% of it is compiling
          # test binaries, so it keeps its build cache (~0.35 GB per arch).
          # #1741 dropped it for budget; the retired never-restored
          # per-SHA action self-test caches (#1829) free more than it costs.
          build-cache: ${{ inputs.os != 'macos-15' }}
          # Bound compile and test concurrency for the 8-GB ARM runner. This
          # is the prescribed ci-tests resource contract; the Test step below
          # remains the only lib/bin test-profile compilation.
          ci-tests: true
          linker: fast
          # Cook bases run on Linux only (zackees/ci.yml#5 RUST-010, #1758).
          prebuild-deps: ${{ startsWith(inputs.os, 'ubuntu') && 'soldr-cook' || 'none' }}
          prebuild-deps-flags: ""
          # #240: seed the isolated test SOLDR_CACHE_DIR (per-OS) from the
          # restored build-cache so the daemon-isolated test phase starts warm
          # across Linux/macOS/Windows.
          seed-isolated-build-cache: ${{ runner.temp }}/zccache-self-tests/test-${{ inputs.os }}
          verify-compile-cache: warn
          # #1677: install the pinned toolchain normally; the standalone
          # cache's 7-11s measured saving did not justify its footprint.
          solo-toolchain-cache: false # #1677 retires the standalone toolchain archive.
      # Platform Test runs unit tests in libraries and binaries only — it
      # intentionally does NOT compile the integration test binaries under
      # `crates/*/tests/`. Most of those binaries' tests are #[ignore]'d, but
      # the binaries are still compiled by `cargo test --workspace`, which
      # cost ~4m of Windows CI time per run (issue #106). Full integration
      # coverage is provided by the `integration` workflow on Linux.
      - name: Build test binaries
        # Compile-only (`--no-run`) against the same isolated cache the Test
        # step uses, so the Test step only runs. No test executes
        # here, so CARGO_BUILD_JOBS/SOLDR_JOBS stay unset: the build uses
        # every core (or setup-soldr's ci-tests bound on small runners).
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/test-${{ inputs.os }}
          # Full-parallel compile on a loaded hosted runner can take >2 s to
          # get the broker's first response (zackees/soldr#3449).
          SOLDR_BROKER_FIRST_RESPONSE_MS: "30000"
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
        run: |
          unset ZCCACHE_CACHE_DIR
          soldr cargo test --workspace --lib --bins --no-fail-fast --no-run
      - name: Test
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/test-${{ inputs.os }}
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          # The workspace lib/bin test profile includes the daemon-core
          # library test, whose compiler admission must be memory-bounded.
          CARGO_BUILD_JOBS: "1"
          SOLDR_JOBS: "1"
        run: |
          set +e
          unset ZCCACHE_CACHE_DIR
          echo "Using isolated test SOLDR_CACHE_DIR=$SOLDR_CACHE_DIR"
          start=$SECONDS
          soldr cargo test --workspace --lib --bins --no-fail-fast 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          dur=$((SECONDS - start))
          echo "- **${{ inputs.os }} / Test**: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

          if [ $status -ne 0 ]; then
            {
              echo '## Test Failures'
              echo '```'
              awk '/^failures:$/,/^test result:/' test-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit $status
      - name: Stop isolated test cache
        if: always()
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/test-${{ inputs.os }}
        run: |
          unset ZCCACHE_CACHE_DIR
          soldr cache shutdown --archive-logs "$SOLDR_CACHE_DIR/cache/zccache/logs/archive" || true
