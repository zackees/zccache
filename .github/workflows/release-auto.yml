name: Auto-Release

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional tag to publish, for example 1.3.0 or v1.3.0. Leave empty to use the current workspace version.
        required: false
        type: string
      dry-run:
        description: Build and package every release target without publishing.
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_HOME: ${{ github.workspace }}/.cargo
  RUSTUP_HOME: ${{ github.workspace }}/.rustup

jobs:
  detect-bump:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Determine whether to proceed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          read_version() {
            python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          print(data["workspace"]["package"]["version"])
          PY
          }

          # Manual dispatch always proceeds — operator chose to run it.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual dispatch — proceeding"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_VERSION="$(read_version)"

          # Push to main: only proceed when Cargo.toml workspace version changed.
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            OLD_VERSION="$(git show HEAD^:Cargo.toml 2>/dev/null \
              | python3 -c "import sys, tomllib; print(tomllib.loads(sys.stdin.read())['workspace']['package']['version'])" 2>/dev/null \
              || echo "")"
            if [ -z "$OLD_VERSION" ] || [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
              echo "no workspace version change ($NEW_VERSION) — skipping release"
              # A skip is the normal case. It is also exactly what a *stuck*
              # release looks like: the bump commit's run failed, and every
              # push after it skips and reports success, so the failure is
              # buried under an unbroken wall of green (issue #1472 -- 1.13.6
              # sat unpublished for a day this way). Check whether this version
              # actually shipped and say so if it did not.
              #
              # Warning, never failure: a missing release is not this push's
              # fault, and failing here would block unrelated work. The point
              # is only to make the state visible on the next push instead of
              # on the next manual PyPI check.
              RELEASED=""
              for CANDIDATE in "$NEW_VERSION" "v$NEW_VERSION"; do
                if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$CANDIDATE" >/dev/null 2>&1; then
                  RELEASED="$CANDIDATE"
                  break
                fi
              done
              if [ -z "$RELEASED" ]; then
                echo "::warning title=Version $NEW_VERSION is bumped but unreleased::No GitHub release exists for $NEW_VERSION. A failed release run does not retry on its own: re-run the bump commit's Auto-Release run, or dispatch release-auto.yml manually. See issue #1472."
              fi
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "version bumped: $OLD_VERSION -> $NEW_VERSION"
          fi

          # Skip if a GitHub release already exists for this version. Prevents
          # double-runs when publish-release creates the tag and re-triggers us.
          # Rerun attempts are allowed through so an operator can restart after
          # the GitHub Release checkpoint exists and resume PyPI/crates.io.
          for CANDIDATE in "$NEW_VERSION" "v$NEW_VERSION"; do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$CANDIDATE" >/dev/null 2>&1; then
              if [ "${RUN_ATTEMPT:-1}" != "1" ]; then
                echo "release $CANDIDATE already exists, but run attempt $RUN_ATTEMPT is a restart - proceeding"
                echo "should_release=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "release $CANDIDATE already exists — skipping"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "should_release=true" >> "$GITHUB_OUTPUT"

  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    needs: detect-bump
    if: needs.detect-bump.outputs.should_release == 'true'
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
      pypi_complete: ${{ steps.registries.outputs.pypi_complete }}
      crates_complete: ${{ steps.registries.outputs.crates_complete }}
      github_release_exists: ${{ steps.meta.outputs.github_release_exists }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Validate release metadata
        run: |
          python - <<'PY'
          from ci.release_checks import validate_release_metadata
          validate_release_metadata()
          PY

      - name: Resolve release version and existing release
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          print(data["workspace"]["package"]["version"])
          PY
          )"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#refs/tags/}"
            CHECKOUT_REF="$TAG"
          else
            TAG="${RAW_TAG#refs/tags/}"
            if [ -z "$TAG" ]; then
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                # A manual recovery run must build the selected revision, not
                # an existing release tag that may predate its workflow fix.
                TAG="$VERSION"
                CHECKOUT_REF="$GITHUB_SHA"
              elif git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
                TAG="$VERSION"
                CHECKOUT_REF="$VERSION"
              elif git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
                TAG="v$VERSION"
                CHECKOUT_REF="$TAG"
              else
                TAG="$VERSION"
                CHECKOUT_REF="$GITHUB_SHA"
              fi
            else
              if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
                CHECKOUT_REF="$TAG"
              else
                CHECKOUT_REF="$GITHUB_SHA"
              fi
            fi
          fi

          NORMALIZED_TAG="${TAG#v}"

          if [ "$NORMALIZED_TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match workspace version $VERSION" >&2
            exit 1
          fi

          SEEN=""
          GITHUB_RELEASE_EXISTS=false
          for CANDIDATE in "$TAG" "$NORMALIZED_TAG" "v$NORMALIZED_TAG"; do
            if [ -z "$CANDIDATE" ]; then
              continue
            fi
            case " $SEEN " in
              *" $CANDIDATE "*) continue ;;
            esac
            SEEN="$SEEN $CANDIDATE"

            RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$CANDIDATE" 2>/dev/null || true)"
            if [ -z "$RELEASE_JSON" ]; then
              continue
            fi

            PUBLISHED_AT="$(RELEASE_JSON="$RELEASE_JSON" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RELEASE_JSON"])
          print(data.get("published_at") or "")
          PY
            )"
            if [ -n "$PUBLISHED_AT" ]; then
              GITHUB_RELEASE_EXISTS=true
              echo "Release $CANDIDATE is already published at $PUBLISHED_AT; release job will update it"
              break
            fi
          done

          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "github_release_exists=$GITHUB_RELEASE_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Check registry publish status
        id: registries
        run: |
          python -m ci.release_workflow check-registries

  bootstrap-zccache:
    name: Bootstrap zccache (bare Cargo)
    runs-on: ubuntu-24.04
    needs: preflight
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-gnu

      - name: Build bootstrap zccache without a compiler wrapper
        env:
          CARGO: cargo
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
        shell: bash
        run: |
          set -euo pipefail
          unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER
          "$CARGO" build --release --target x86_64-unknown-linux-gnu \
            -p zccache --features zccache-bin --bin zccache
          mkdir -p bootstrap-zccache
          install -m 0755 \
            target/x86_64-unknown-linux-gnu/release/zccache \
            bootstrap-zccache/zccache

      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-zccache
          path: bootstrap-zccache/zccache
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    needs: [preflight, bootstrap-zccache]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            binary_ext: ""
            prebuild_deps: none
            clear_target_after_setup: "true"
            include_python: "false"
            upload_binaries: "false"
            upload_release: "true"

          - target: aarch64-unknown-linux-musl
            binary_ext: ""
            prebuild_deps: none
            clear_target_after_setup: "true"
            include_python: "false"
            upload_binaries: "false"
            upload_release: "true"

          - target: x86_64-unknown-linux-gnu
            binary_ext: ""
            prebuild_deps: none
            clear_target_after_setup: "true"
            include_python: "true"
            upload_binaries: "true"
            upload_release: "false"

          - target: aarch64-unknown-linux-gnu
            binary_ext: ""
            prebuild_deps: none
            clear_target_after_setup: "true"
            include_python: "true"
            upload_binaries: "true"
            upload_release: "false"

          - target: x86_64-apple-darwin
            binary_ext: ""
            prebuild_deps: none
            clear_target_after_setup: "true"
            include_python: "true"
            upload_binaries: "true"
            upload_release: "true"

          - target: aarch64-apple-darwin
            binary_ext: ""
            prebuild_deps: none
            clear_target_after_setup: "true"
            include_python: "true"
            upload_binaries: "true"
            upload_release: "true"

          - target: x86_64-pc-windows-msvc
            binary_ext: ".exe"
            prebuild_deps: none
            clear_target_after_setup: "true"
            include_python: "true"
            upload_binaries: "true"
            upload_release: "true"

          - target: aarch64-pc-windows-msvc
            binary_ext: ".exe"
            prebuild_deps: none
            clear_target_after_setup: "true"
            require_debug_sidecars: "false"
            include_python: "true"
            upload_binaries: "true"
            upload_release: "true"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - uses: actions/download-artifact@v8
        with:
          name: bootstrap-zccache
          path: ${{ runner.temp }}/bootstrap-zccache

      - name: Install bootstrap zccache for soldr
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bootstrap-zccache/zccache"
          echo "$RUNNER_TEMP/bootstrap-zccache" >> "$GITHUB_PATH"
          echo "SOLDR_RUSTC_WRAPPER=$RUNNER_TEMP/bootstrap-zccache/zccache" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bootstrap-zccache/zccache" --version

      - uses: ./.github/actions/build-target
        id: build_target
        with:
          target: ${{ matrix.target }}
          binary_ext: ${{ matrix.binary_ext }}
          cache_key: release-${{ matrix.target }}
          use_soldr: "true"
          cross_compile: "true"
          prebuild_deps: ${{ matrix.prebuild_deps || 'soldr-cook' }}
          clear_target_after_setup: ${{ matrix.clear_target_after_setup || 'false' }}
          require_debug_sidecars: ${{ matrix.require_debug_sidecars || 'true' }}
          include_python: ${{ matrix.include_python }}
          version: ${{ needs.preflight.outputs.version }}

      - uses: actions/upload-artifact@v7
        if: matrix.upload_binaries == 'true'
        with:
          name: binaries-${{ matrix.target }}
          path: ${{ steps.build_target.outputs.staging_dir }}/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: matrix.upload_release == 'true'
        with:
          name: release-${{ matrix.target }}
          path: ${{ format('{0}/*{1}', steps.build_target.outputs.standalone_dir, matrix.binary_ext == '.exe' && '.zip' || '.tar.gz') }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: |
      always()
      && needs.preflight.result == 'success'
      && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - uses: astral-sh/setup-uv@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Add installer scripts
        run: |
          cp install.sh release-assets/install.sh
          cp install.ps1 release-assets/install.ps1
          chmod 755 release-assets/install.sh

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Generate manifest.json
        shell: bash
        # Issue #858: publish a static manifest so soldr resolves binaries via
        # the release-asset CDN instead of the rate-limited GitHub releases API.
        # Runs after checksums so it enumerates the final archive set; the
        # manifest lands in release-assets/ and is swept up by the upload glob.
        run: |
          uv run --no-project ci/build_release_manifest.py \
            --assets-dir release-assets \
            --version "${{ needs.preflight.outputs.version }}" \
            --tag "${{ needs.preflight.outputs.release_tag }}" \
            --repo "${{ github.repository }}"

      - name: Publish or update release
        if: inputs['dry-run'] != true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.release_tag }}
          name: zccache ${{ needs.preflight.outputs.version }}
          body: |
            ## Install

            ```bash
            curl -LsSf https://github.com/zackees/zccache/releases/latest/download/install.sh | sh
            ```

            ```powershell
            powershell -ExecutionPolicy Bypass -c "irm https://github.com/zackees/zccache/releases/latest/download/install.ps1 | iex"
            ```

            GitHub Marketplace publication remains a manual GitHub UI step:
            open the generated release, select `Publish this action to the GitHub Marketplace`,
            choose categories, and publish.
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true

  build-wheels:
    name: Build PyPI Wheels
    runs-on: ubuntu-latest
    needs: [preflight, build, publish-release]
    if: needs.preflight.outputs.pypi_complete != 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: artifact-downloads

      - name: Build wheels from downloaded artifacts
        run: python -m ci.release_workflow build-wheels --artifact-download-dir artifact-downloads

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-wheels
          path: dist/wheels/*
          if-no-files-found: error

  test-wheels:
    # One leg per wheel family actually produced by `build-wheels`, keyed by
    # the platform tag so the coverage invariant is mechanical. A leg for a
    # family that is not built can never pass: `pip --no-index --find-links`
    # finds no candidate, so the whole release is blocked before publish.
    # Keep this list in lockstep with `PLATFORMS` in `ci/release_workflow.py`
    # -- `test_release_workflow.py` enforces set equality.
    name: Test PyPI Wheel (${{ matrix.wheel_plat }})
    runs-on: ${{ matrix.os }}
    needs: [preflight, build-wheels]
    if: needs.preflight.outputs.pypi_complete != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wheel_plat: manylinux_2_17_x86_64
          - os: ubuntu-24.04-arm
            wheel_plat: manylinux_2_17_aarch64
          - os: macos-14
            wheel_plat: macosx_11_0_arm64
          - os: windows-latest
            wheel_plat: win_amd64
          - os: windows-11-arm
            wheel_plat: win_arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          name: pypi-wheels
          path: dist/wheels

      - name: Install and test the platform wheel
        run: |
          python -m pip install --disable-pip-version-check --no-index --find-links dist/wheels "zccache==${{ needs.preflight.outputs.version }}"
          python ci/test_exec_cached_wheel.py

  # #1535: wheel families whose runner cannot be relied on to schedule. Split
  # into a separate job rather than flagged inside `test-wheels`, because
  # nothing in the publish chain may `needs:` this one.
  #
  # `continue-on-error` was the first attempt and does not work here. It
  # neutralizes a job that RUNS and FAILS; the observed failure is a job that
  # never starts. A queued job has no result, so `needs: test-wheels` simply
  # waits -- for the 24h queue limit, not for the fix. During 1.13.14 the
  # `macos-14` arm64 leg finished in minutes while `macos-15-intel` never
  # picked up a host, twice, and the crates.io publish sat behind it both
  # times. A gate that cannot run is not a gate, and the only way to stop it
  # gating is to take it out of the dependency edge.
  #
  # The wheel is still built, still published, and still smoke-tested when a
  # host is available -- the result just cannot block the release. Coverage
  # stays enforced: `test_release_workflow.py` unions this matrix with
  # `test-wheels` and holds the total in set-equality lockstep with
  # `PLATFORMS`, so a family cannot lose its smoke test by being moved here.
  # Dropping Intel macOS entirely remains a product decision, not a CI one.
  test-wheels-ungated:
    name: Test PyPI Wheel (${{ matrix.wheel_plat }})
    runs-on: ${{ matrix.os }}
    needs: [preflight, build-wheels]
    if: needs.preflight.outputs.pypi_complete != 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            wheel_plat: macosx_10_12_x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          name: pypi-wheels
          path: dist/wheels

      - name: Install and test the platform wheel
        run: |
          python -m pip install --disable-pip-version-check --no-index --find-links dist/wheels "zccache==${{ needs.preflight.outputs.version }}"
          python ci/test_exec_cached_wheel.py

  publish-pypi:
    name: Publish PyPI
    runs-on: ubuntu-latest
    needs: [preflight, publish-release, build-wheels, test-wheels]
    if: |
      always()
      && needs.preflight.result == 'success'
      && needs.publish-release.result == 'success'
      && inputs['dry-run'] != true
      && needs.preflight.outputs.pypi_complete != 'true'
      && needs.build-wheels.result == 'success'
      && needs.test-wheels.result == 'success'
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-wheels
          path: dist/wheels

      - name: Publish wheel distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels/
          print-hash: true
          skip-existing: true

      # Issue #483: pypa/gh-action-pypi-publish uploads wheels
      # sequentially, so downstream `uv sync` running mid-upload can
      # cache a partial wheel set and refuse to install. Poll the PyPI
      # JSON API until every wheel we just uploaded is visible before
      # this job returns success.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.checkout_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Issue #657: `actions/checkout@v6` above wipes the workspace,
      # including `dist/wheels/` populated by the earlier download-
      # artifact step. Re-download the artifact post-checkout so the
      # verify step's `--wheels-dir dist/wheels` lookup succeeds.
      # Without this, the verify step fails with "wheels directory does
      # not exist" even though the actual publish step already ran
      # successfully — release-auto reports failure on a green release.
      - uses: actions/download-artifact@v8
        with:
          name: pypi-wheels
          path: dist/wheels
      - name: Verify all wheels visible on PyPI
        run: |
          python -m ci.release_workflow verify-pypi \
            --project zccache \
            --version "${{ needs.preflight.outputs.version }}" \
            --wheels-dir dist/wheels \
            --timeout-s 300 \
            --poll-interval-s 5

  publish-crates:
    name: Publish crates.io
    runs-on: ubuntu-latest
    needs: [preflight, publish-release, publish-pypi]
    if: |
      always()
      && needs.preflight.result == 'success'
      && needs.publish-release.result == 'success'
      && inputs['dry-run'] != true
      && needs.preflight.outputs.crates_complete != 'true'
      && (needs.preflight.outputs.pypi_complete == 'true' || needs.publish-pypi.result == 'success')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python -m ci.release_workflow publish-crates
