name: Coverage

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: zackees/setup-soldr@dfbe9627f6cb0226716b61625b99a58949162720 # v0.9.79
        with:
          save-cache: auto
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          linker: fast
          prebuild-deps: soldr-cook
          prebuild-deps-flags: ""
          # #240: seed the isolated coverage SOLDR_CACHE_DIR from the restored
          # build-cache so the daemon-isolated llvm-cov phase starts warm.
          seed-isolated-build-cache: ${{ runner.temp }}/zccache-self-tests/coverage
          verify-compile-cache: warn
          # llvm-tools-preview is installed after setup-soldr. A solo-cache
          # restore can preserve its manifest without llvm-profdata; the
          # action explicitly requires opting out for post-setup components.
          # See #1429 and setup-soldr#334.
          solo-toolchain-cache: false
      - name: Install Rust coverage component
        run: soldr rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Stop setup-soldr builder cache before coverage tests
        uses: zackees/setup-soldr/cleanup@dfbe9627f6cb0226716b61625b99a58949162720 # v0.9.79
      - name: Generate coverage
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/coverage
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          # llvm-cov builds the workspace lib/bin test profile in its own
          # target directory, including the daemon-core library test.
          CARGO_BUILD_JOBS: "1"
          SOLDR_JOBS: "1"
        run: |
          unset ZCCACHE_CACHE_DIR
          echo "Using isolated coverage SOLDR_CACHE_DIR=$SOLDR_CACHE_DIR"
          # --lib --bins matches ci-check.yml's test scope. The integration
          # tests under crates/*/tests spawn helper binaries via
          # env!("CARGO_BIN_EXE_*"); cargo never builds required-features
          # bins for `cargo test`, so under llvm-cov's separate target dir
          # (target/llvm-cov-target) those spawns fail with NotFound
          # (issue #1025: cli_cache_root broke Coverage on every push since
          # 2026-07-07). Spawned children wouldn't contribute coverage
          # anyway — scope to in-process unit tests.
          soldr cargo llvm-cov --workspace --lib --bins --lcov --output-path lcov.info
      - name: Stop isolated coverage cache
        if: always()
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/zccache-self-tests/coverage
        run: |
          unset ZCCACHE_CACHE_DIR
          soldr cache shutdown --archive-logs "$SOLDR_CACHE_DIR/cache/zccache/logs/archive" || true
      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
