name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Superseded PR runs used to keep holding macOS slots while a fresh run
# queued behind them. Against GitHub's 5-concurrent-job macOS cap that is
# what produced the 16 -> 32 -> 49 -> 59 minute queue staircase. Pushes to
# main are never cancelled; the selector runs this macOS job only in full mode.
permissions:
  actions: read
  contents: read

concurrency:
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  select:
    uses: ./.github/workflows/ci-select.yml
    with:
      workflow: ci-macos.yml

  # Full CI executes both architectures on native GitHub-hosted machines.
  macos:
    needs: select
    if: needs.select.outputs.selected == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    uses: ./.github/workflows/ci-check.yml
    with:
      os: ${{ matrix.os }}
      run_check: false

  observe-macos-queue:
    needs: [select, macos]
    if: always() && needs.select.outputs.selected == 'true'
    name: Observe macOS runner queue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Bound macOS queue starvation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python 3.13 python ci/observe_runner_queue.py
          --repository "${{ github.repository }}" --run-id "${{ github.run_id }}"
          --runner macos-15-intel
          --job "macos (macos-15-intel) / Test"
          --token "$GITHUB_TOKEN"
