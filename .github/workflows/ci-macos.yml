name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Superseded PR runs used to keep holding macOS slots while a fresh run
# queued behind them. Against GitHub's 5-concurrent-job macOS cap that is
# what produced the 16 -> 32 -> 49 -> 59 minute queue staircase. Pushes to
# main are never cancelled; the selector runs this macOS job only in full mode.
permissions:
  actions: read
  contents: read

concurrency:
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  select:
    uses: ./.github/workflows/ci-select.yml
    with:
      workflow: ci-macos.yml

  # macos-15 is Apple Silicon. This was previously two jobs, `x86` and `arm`,
  # both pinned to the same arm64 image, byte-identical duplicates that also derived the
  # same cache-key-suffix and so raced each other on cache save. Real Intel
  # coverage would mean macos-13, which is deliberately avoided: see
  # wrapper-e2e.yml, where that pool cost 15+ minutes of queue wait per run.
  macos:
    needs: select
    if: needs.select.outputs.selected == 'true'
    uses: ./.github/workflows/ci-check.yml
    with:
      os: macos-15
      run_check: false

  observe-macos-queue:
    needs: [select, macos]
    if: always() && needs.select.outputs.selected == 'true'
    name: Observe macOS runner queue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Bound macOS queue starvation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python 3.13 python ci/observe_runner_queue.py
          --repository "${{ github.repository }}" --run-id "${{ github.run_id }}"
          --runner macos-15 --job "macos / Test" --token "$GITHUB_TOKEN"
