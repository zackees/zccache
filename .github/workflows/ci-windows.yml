name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  select:
    uses: ./.github/workflows/ci-select.yml
    with:
      workflow: ci-windows.yml

  x86:
    needs: select
    if: needs.select.outputs.selected == 'true'
    uses: ./.github/workflows/ci-check.yml
    with:
      os: windows-latest
      run_check: false

  arm:
    needs: select
    if: needs.select.outputs.selected == 'true'
    uses: ./.github/workflows/ci-check.yml
    with:
      os: windows-11-arm
      run_check: false
