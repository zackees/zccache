name: Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"

concurrency:
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: ci-windows-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  x86:
    uses: ./.github/workflows/ci-check.yml
    with:
      os: windows-latest
      run_check: false

  arm:
    uses: ./.github/workflows/ci-check.yml
    with:
      os: windows-11-arm
      run_check: false
