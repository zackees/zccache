name: Wire stability

# zackees/zccache#693 Phase 1.
#
# Fails the PR if a protobuf field has been removed, renumbered, or had
# its name or type changed against the frozen snapshot at
# ci/wire_stability_snapshot.txt. Adding new fields is allowed and does
# not require updating the snapshot. The contract is documented in
# docs/WIRE_STABILITY.md.
#
# Intentionally a small Python-only job (no Rust toolchain, no protoc),
# so it runs in seconds and never falls behind on cache state.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR events
# key on run_id so each gets its own group -- GitHub keeps only ONE pending
# run per group, so a shared group silently drops queued main-push SHAs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  select:
    uses: ./.github/workflows/ci-select.yml
    with:
      workflow: wire-stability.yml

  check:
    name: Verify wire stability snapshot
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Run the wire stability guard
        run: uv run python ci/check_wire_stability.py
