name: Clippy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Feature set that makes `--all-targets` compile the feature-gated
  # integration tests (`zccache::ci`, `zccache::cli`, `zccache::symbols`,
  # the `zip`/download installer test, …). Kept in sync with
  # `integration.yml`'s ZCCACHE_INTEGRATION_FEATURES — without it,
  # `clippy --workspace --all-targets` fails to compile those tests with
  # `unresolved import` (the long-standing red Clippy job).
  ZCCACHE_CLIPPY_FEATURES: "zccache/zccache-bin,zccache/daemon-bin,zccache/download-bin,zccache/download-daemon-bin,zccache/fingerprint-bin,zccache/stamp-bin,zccache/ci-bin,zccache/crash-tools,zccache/tokio-console,zccache/test-support,zccache/heap-profile"
  # NOTE: -D warnings deliberately omitted (#944). The workspace
  # [lints.clippy] block in Cargo.toml uses `deny` for the panic-class
  # lints (unwrap_used / unwrap_in_result / panic_in_result_fn) which
  # error on their own, and `warn` for expect_used — which is an
  # intentional documented-invariant escape hatch. Escalating warn → error
  # here would defeat that. Other workflows keep -D warnings.

jobs:
  cache-pre-prune:
    name: Cache pre-prune barrier
    uses: ./.github/workflows/wait-cache-pre-prune.yml
    permissions:
      actions: read
      contents: read

  clippy:
    needs: cache-pre-prune
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Wait for current-main cache pre-prune
        uses: ./.github/actions/wait-cache-pre-prune
      - uses: zackees/setup-soldr@4df8db93438594f50505574d9dc8117505d33362 # v0.9.80
        with:
          cook-delta: false # per-commit delta layer off (setup-soldr#528)
          # Local act runs (bosn; pull_request events) save fully; GitHub keeps
          # the #1677 main-push-only rule. See SAVE_CACHE_POLICY in ci/check_cache_footprint.py.
          save-cache: ${{ env.ACT && 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'auto' || 'false') }}
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          linker: fast
          prebuild-deps: soldr-cook
          prebuild-deps-flags: ""
          verify-compile-cache: warn
          # #1677: standalone toolchain snapshots are disabled repo-wide.
          solo-toolchain-cache: false # #1677 retires the standalone toolchain archive.
      - name: Install Clippy
        run: soldr rustup component add clippy
      - name: Run Clippy
        run: soldr cargo clippy --workspace --all-targets --features "$ZCCACHE_CLIPPY_FEATURES"
