name: Linux

on:
  # Manual full run (includes native arm64); see the `arm` job.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"

permissions:
  actions: read
  contents: read

concurrency:
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # GEN-021 verified reuse, SHADOW mode only (zackees/ci.yml#162). It records
  # whether this main push's tree is byte-identical to a PR head whose Linux
  # CI passed the jobs listed below, in the job summary. Observation only:
  # nothing needs this job, `--mode shadow` always reports reuse=false, and
  # continue-on-error keeps any failure here from turning the run red.
  # Required jobs: green on both recent PR and main-push runs; the cache
  # pre-prune barrier is main-push cache plumbing, not validation, so it is
  # deliberately not a proof requirement.
  reuse-shadow:
    name: Verified reuse decision (shadow)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out ci-lint (zackees/ci.yml, pinned)
        uses: actions/checkout@v6
        with:
          repository: zackees/ci.yml
          ref: b93b8c4a20ce3cd476c75a278ad01a31bde2438b
          path: .ci-lint
          persist-credentials: false
      - name: Verified reuse decision (GEN-021, shadow)
        working-directory: .ci-lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -m ci_lint reuse-check --workflow ci-linux.yml --mode shadow
          --max-age-hours 24
          --required-job "x86 / Check"
          --required-job "x86 / Test"
          --required-job "x86-musl / Check (linux-x86-musl)"
          --required-job "arm-musl / Check (linux-arm-musl)"

  cache-pre-prune:
    name: Cache pre-prune barrier
    uses: ./.github/workflows/wait-cache-pre-prune.yml
    permissions:
      actions: read
      contents: read

  x86:
    needs: cache-pre-prune
    uses: ./.github/workflows/ci-check.yml
    with:
      os: ubuntu-latest

  arm:
    needs: cache-pre-prune
    # Native arm64 is off the PR and main-push paths: its cook/registry/build
    # caches were ~1 GB of the repo's 10 GB on main. It runs only on a manual
    # dispatch (ci-full equivalent), which never saves caches (save-cache is
    # main-push-only). The arm64 musl cross check below still runs on every
    # PR and push (cheap, compiles the aarch64 target from the x64 runner).
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci-check.yml
    with:
      os: ubuntu-24.04-arm

  x86-musl:
    needs: cache-pre-prune
    uses: ./.github/workflows/ci-check-cross.yml
    with:
      os: ubuntu-latest
      target: x86_64-unknown-linux-musl
      label: linux-x86-musl

  arm-musl:
    needs: cache-pre-prune
    uses: ./.github/workflows/ci-check-cross.yml
    with:
      # setup-soldr's aarch64-musl cross compiler is an x86_64 host tool.
      # Native ARM coverage remains in the separate arm job above.
      os: ubuntu-latest
      target: aarch64-unknown-linux-musl
      label: linux-arm-musl
