name: Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  select:
    uses: ./.github/workflows/ci-select.yml
    with:
      workflow: ci-linux.yml

  x86:
    needs: select
    if: needs.select.outputs.selected == 'true'
    uses: ./.github/workflows/ci-check.yml
    with:
      os: ubuntu-latest

  arm:
    needs: select
    if: needs.select.outputs.mode == 'full'
    uses: ./.github/workflows/ci-check.yml
    with:
      os: ubuntu-24.04-arm

  x86-musl:
    needs: select
    if: needs.select.outputs.mode == 'full'
    uses: ./.github/workflows/ci-check-cross.yml
    with:
      os: ubuntu-latest
      target: x86_64-unknown-linux-musl
      label: linux-x86-musl

  arm-musl:
    needs: select
    if: needs.select.outputs.mode == 'full'
    uses: ./.github/workflows/ci-check-cross.yml
    with:
      # setup-soldr's aarch64-musl cross compiler is an x86_64 host tool.
      # Native ARM coverage remains in the separate arm job above.
      os: ubuntu-latest
      target: aarch64-unknown-linux-musl
      label: linux-arm-musl
