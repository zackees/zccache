[package]
name = "ban_raw_subprocess_in_daemon"
# 2026-06-15: bumped to bust the dylint .so cache when allowlist.txt
# changes — see ban_std_pathbuf for the same workaround rationale.
version = "0.2.1"
description = "Ban raw std/tokio Command spawn/output/status in zccache-daemon production code"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Match the dylint_linting pin used by the sibling dylints — same toolchain
# (rust-toolchain.toml here), same upstream commit.
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]
