[package]
name = "ban_raw_subprocess_in_daemon"
# Bust the Dylint library cache when matcher or scope rules change.
# See ban_std_pathbuf for the same workaround rationale.
version = "0.3.0"
description = "Require running-process for all zccache-daemon child creation"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Match the dylint_linting pin used by the sibling dylints — same toolchain
# (rust-toolchain.toml here), same upstream commit.
dylint_linting = "=6.0.3"

[dev-dependencies]
dylint_testing = "=6.0.3"

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]
