[package]
# Bump `version` whenever `src/baseline.txt` changes: cargo-dylint keys its
# compiled-library cache on this manifest, not on the embedded baseline, so a
# baseline edit without a version bump would keep running the stale library.
name = "enforce_platform_boundary"
version = "0.1.8"
description = "Confine host-platform selection and native APIs to the zccache-platform leaf crate"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Match the dylint_linting pin used by the sibling dylints — same toolchain
# (rust-toolchain.toml here), same upstream commit.
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]
