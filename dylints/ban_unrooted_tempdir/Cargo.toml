[package]
name = "ban_unrooted_tempdir"
# 2026-06-15: bumped to bust the dylint .so cache when allowlist.txt
# changes — see ban_std_pathbuf for the same workaround rationale.
version = "0.3.0"
description = "Ban tempdir/temp_dir calls that aren't rooted under zccache's cache dir"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Match the dylint_linting pin used by ban_std_pathbuf — same toolchain, same
# upstream commit until a crates.io release ships the post-2026-03-18
# rustc_session fix.
dylint_linting = "=6.0.3"

[dev-dependencies]
dylint_testing = "=6.0.3"

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]
